<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>マッスルペット - 筋トレ記録</title>
<style>
  :root {
    --bg: #fff8f0;
    --card: #ffffff;
    --text: #3a2e2a;
    --sub: #8a7a72;
    --accent: #ff7a45;
    --accent2: #ffb347;
    --line: #f0e2d6;
    --good: #3cb371;
    --bad: #e05656;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: calc(72px + env(safe-area-inset-bottom));
  }
  header {
    padding: 14px 16px 6px;
    font-weight: 700;
    font-size: 18px;
    display: flex; justify-content: space-between; align-items: center;
  }
  header small { color: var(--sub); font-weight: 400; font-size: 12px; }
  main { max-width: 560px; margin: 0 auto; padding: 0 12px; }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 16px;
    margin: 10px 0;
    box-shadow: 0 2px 8px rgba(120, 80, 40, .08);
  }
  .card h2 { font-size: 15px; margin: 0 0 10px; }
  .hidden { display: none !important; }

  /* キャラ */
  .pet-wrap { text-align: center; }
  .pet-name { font-size: 20px; font-weight: 700; margin: 4px 0 0; }
  .pet-name button { font-size: 12px; margin-left: 4px; }
  .pet-stage { color: var(--sub); font-size: 13px; }
  #petSvg { width: 260px; height: 205px; overflow: visible; }
  .bubble {
    display: inline-block;
    background: #fff3e6; border: 2px solid var(--accent2);
    border-radius: 14px; padding: 6px 12px; font-size: 14px; margin-top: 4px;
  }
  .bob { animation: bob 2.2s ease-in-out infinite; transform-origin: center bottom; }
  .sad { animation: sad 4s ease-in-out infinite; transform-origin: center bottom; }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
  @keyframes sad { 0%,100% { transform: translateY(0) } 50% { transform: translateY(2px) } }
  .levelup { animation: pop .8s ease; }
  @keyframes pop { 0% { transform: scale(1) } 40% { transform: scale(1.18) } 100% { transform: scale(1) } }

  .bar { height: 12px; background: var(--line); border-radius: 6px; overflow: hidden; }
  .bar > div { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width .6s; }
  .row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin: 4px 0; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
  .stat .row { margin: 0 0 3px; }
  .stat .bar { height: 8px; }
  .stat .bar > div { background: var(--c); }
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; gap: 6px; }
  .summary b { display: block; font-size: 20px; }
  .summary span { font-size: 11px; color: var(--sub); }

  /* フォーム */
  label { display: block; font-size: 12px; color: var(--sub); margin: 8px 0 3px; }
  input, select, button { font: inherit; }
  input, select {
    width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: #fffdfb;
  }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .btn {
    display: block; width: 100%; margin-top: 14px; padding: 13px;
    border: none; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 700; font-size: 16px;
  }
  .btn.sub { background: #f3e7dc; color: var(--text); font-weight: 400; font-size: 14px; }
  .mini { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 3px 8px; font-size: 12px; cursor: pointer; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer;
  }
  .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* 履歴 */
  .day { margin: 14px 0 4px; font-weight: 700; font-size: 13px; color: var(--sub); }
  .entry {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px;
  }
  .entry .meta { color: var(--sub); font-size: 12px; }
  .entry .xp { color: var(--accent); font-weight: 700; font-size: 13px; margin-right: 8px; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 6px; color: #fff; margin-right: 4px; }
  .empty { text-align: center; color: var(--sub); padding: 24px 0; font-size: 14px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal div { aspect-ratio: 1; border-radius: 4px; background: var(--line); }
  .cal div.l1 { background: #ffd2a8; } .cal div.l2 { background: #ffa66b; } .cal div.l3 { background: #ff7a45; }

  /* タブ */
  nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; background: #fff; border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1; border: none; background: none; padding: 10px 0 8px; font-size: 11px; color: var(--sub); cursor: pointer;
  }
  nav button span { display: block; font-size: 22px; }
  nav button.on { color: var(--accent); font-weight: 700; }

  /* トースト */
  #toast {
    position: fixed; left: 50%; top: 20px; transform: translateX(-50%);
    background: var(--text); color: #fff; padding: 10px 18px; border-radius: 12px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 10; text-align: center; max-width: 90%;
  }
  #toast.show { opacity: .95; }
</style>
</head>
<body>
<header>
  <div>💪 マッスルペット</div>
  <small id="todayLabel"></small>
</header>

<main>
  <!-- ホーム -->
  <section id="tab-home">
    <div class="card pet-wrap">
      <div id="petBox"><svg id="petSvg" viewBox="-30 -5 260 205"></svg></div>
      <div class="pet-name"><span id="petName"></span> <button class="mini" id="renameBtn">名前変更</button></div>
      <div class="pet-stage" id="petStage"></div>
      <div class="bubble" id="petTalk"></div>
    </div>

    <div class="card">
      <div class="row"><b id="levelLabel">Lv 1</b><span id="xpLabel"></span></div>
      <div class="bar"><div id="xpBar" style="width:0"></div></div>
      <div class="row" style="margin-top:8px"><span>きげん</span><span id="moodLabel"></span></div>
      <div class="row"><span>連続トレーニング</span><span id="streakLabel"></span></div>
    </div>

    <div class="card">
      <h2>ステータス</h2>
      <div class="stats" id="stats"></div>
    </div>

    <div class="card">
      <h2>これまでの記録</h2>
      <div class="summary">
        <div><b id="sumDays">0</b><span>トレーニング日数</span></div>
        <div><b id="sumSets">0</b><span>総セット数</span></div>
        <div><b id="sumVolume">0</b><span>総挙上量(kg)</span></div>
      </div>
    </div>
  </section>

  <!-- 記録 -->
  <section id="tab-log" class="hidden">
    <div class="card">
      <h2>トレーニングを記録</h2>
      <label>日付</label>
      <input type="date" id="fDate">
      <label>部位</label>
      <div class="chips" id="partChips"></div>
      <label>種目</label>
      <select id="fExercise"></select>
      <input id="fCustom" class="hidden" placeholder="種目名を入力" style="margin-top:6px">
      <div id="weightFields">
        <div class="grid3">
          <div><label>重量(kg)</label><input type="number" id="fWeight" inputmode="decimal" min="0" step="0.5" placeholder="0=自重"></div>
          <div><label>回数</label><input type="number" id="fReps" inputmode="numeric" min="1" placeholder="10"></div>
          <div><label>セット数</label><input type="number" id="fSets" inputmode="numeric" min="1" value="3"></div>
        </div>
      </div>
      <div id="cardioFields" class="hidden">
        <label>時間(分)</label><input type="number" id="fMinutes" inputmode="numeric" min="1" placeholder="30">
      </div>
      <div class="row" style="margin-top:10px"><span>獲得予定XP</span><b id="xpPreview" style="color:var(--accent)">0 XP</b></div>
      <button class="btn" id="saveBtn">記録してキャラを育てる！</button>
    </div>
    <div class="card">
      <h2>今日の記録</h2>
      <div id="todayList"></div>
    </div>
  </section>

  <!-- 履歴 -->
  <section id="tab-history" class="hidden">
    <div class="card">
      <h2>直近12週間</h2>
      <div class="cal" id="cal"></div>
    </div>
    <div class="card">
      <h2>履歴</h2>
      <div id="historyList"></div>
    </div>
    <div class="card">
      <h2>データ管理</h2>
      <button class="btn sub" id="exportBtn">バックアップを保存（JSON）</button>
      <button class="btn sub" id="importBtn">バックアップから復元</button>
      <input type="file" id="importFile" accept="application/json" class="hidden">
      <button class="btn sub" id="resetBtn" style="color:var(--bad)">すべてのデータを削除</button>
    </div>
  </section>
</main>

<nav>
  <button data-tab="home" class="on"><span>🐣</span>キャラ</button>
  <button data-tab="log"><span>✏️</span>記録</button>
  <button data-tab="history"><span>📅</span>履歴</button>
</nav>

<div id="toast"></div>

<script>
// ===== 定義 =====
const PARTS = {
  chest:    { name: '胸',     stat: 'パワー',   color: '#ff6b6b', ex: ['ベンチプレス', 'ダンベルプレス', 'インクラインプレス', 'ダンベルフライ', '腕立て伏せ', 'ディップス'] },
  back:     { name: '背中',   stat: 'タフさ',   color: '#4d96ff', ex: ['デッドリフト', '懸垂', 'ラットプルダウン', 'ベントオーバーロウ', 'シーテッドロウ'] },
  legs:     { name: '脚',     stat: 'ふんばり', color: '#6bcb77', ex: ['スクワット', 'レッグプレス', 'ランジ', 'ブルガリアンスクワット', 'レッグカール', 'カーフレイズ'] },
  shoulder: { name: '肩',     stat: 'かまえ',   color: '#ffa94d', ex: ['ショルダープレス', 'サイドレイズ', 'フロントレイズ', 'リアレイズ', 'アップライトロウ'] },
  arms:     { name: '腕',     stat: 'うでっぷし', color: '#c77dff', ex: ['バーベルカール', 'ダンベルカール', 'ハンマーカール', 'トライセプスエクステンション', 'ナローベンチ'] },
  core:     { name: '腹',     stat: 'たいかん', color: '#ffd43b', ex: ['クランチ', 'プランク(秒→回数)', 'レッグレイズ', 'アブローラー', 'ロシアンツイスト'] },
  cardio:   { name: '有酸素', stat: 'スタミナ', color: '#20c997', ex: ['ランニング', 'ウォーキング', 'バイク', '水泳', 'なわとび', 'HIIT'] },
};
const STAGES = [
  { lv: 1,  name: 'たまご',         color: '#fff4dc' },
  { lv: 3,  name: 'ベビーマッチョ', color: '#ffe0b8' },
  { lv: 6,  name: 'キッズマッチョ', color: '#ffc98f' },
  { lv: 11, name: 'マッチョ',       color: '#ffad6b' },
  { lv: 20, name: 'スーパーマッチョ', color: '#ff8f5a' },
  { lv: 35, name: 'レジェンドマッチョ', color: '#ffcf40' },
];
const STORE_KEY = 'musclePet.v1';

// ===== 保存 =====
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE_KEY));
    if (d && Array.isArray(d.records)) return d;
  } catch (e) {}
  return { petName: 'マッスルくん', records: [] };
}
function save() { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
let data = load();

// ===== 日付ユーティリティ =====
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const dayDiff = (a, b) => Math.round((new Date(b + 'T00:00') - new Date(a + 'T00:00')) / 86400000);

// ===== XP 計算 =====
// 1種目あたりのXP（連続日数ボーナスは別）
function baseXp(r) {
  if (r.part === 'cardio') return Math.round(5 + r.minutes * 1.5);
  const w = Number(r.weight) || 0;
  return Math.round(5 + r.sets * r.reps * (1 + w / 25) * 0.5);
}
// Lv n → n+1 に必要なXP
const xpForNext = lv => 40 + lv * 30;

// 記録から状態を全部計算し直す（記録を消してもズレない）
function computeState() {
  const recs = [...data.records].sort((a, b) => a.date.localeCompare(b.date) || a.id - b.id);
  const days = [...new Set(recs.map(r => r.date))].sort();
  // 日ごとの連続日数（その日まで何日続いているか）
  const streakOf = {};
  days.forEach((d, i) => {
    streakOf[d] = (i > 0 && dayDiff(days[i - 1], d) === 1) ? streakOf[days[i - 1]] + 1 : 1;
  });
  let total = 0, sets = 0, volume = 0;
  const stat = Object.fromEntries(Object.keys(PARTS).map(k => [k, 0]));
  for (const r of recs) {
    const bonus = 1 + Math.min(streakOf[r.date] - 1, 5) * 0.1; // 連続日数で最大+50%
    r._xp = Math.round(baseXp(r) * bonus);
    total += r._xp;
    stat[r.part] += r._xp;
    if (r.part !== 'cardio') { sets += r.sets; volume += (Number(r.weight) || 0) * r.reps * r.sets; }
  }
  let lv = 1, rest = total;
  while (rest >= xpForNext(lv)) { rest -= xpForNext(lv); lv++; }
  const last = days[days.length - 1];
  const idle = last ? dayDiff(last, today()) : null;
  let streak = 0;
  if (last && idle <= 1) streak = streakOf[last];
  const stageIdx = STAGES.reduce((acc, s, i) => lv >= s.lv ? i : acc, 0);
  return { total, lv, rest, need: xpForNext(lv), stat, sets, volume, days, idle, streak, stageIdx, recs };
}

function moodOf(st) {
  if (st.idle === null) return { key: 'new', label: 'わくわく', face: 'happy' };
  if (st.idle <= 1) return { key: 'great', label: 'ゴキゲン！', face: 'happy' };
  if (st.idle <= 3) return { key: 'ok', label: 'ふつう', face: 'normal' };
  if (st.idle <= 6) return { key: 'sad', label: 'しょんぼり…', face: 'sad' };
  return { key: 'tired', label: 'ぐったり…', face: 'tired' };
}

function talkOf(st, mood) {
  if (st.stageIdx === 0) {
    if (st.idle === null) return 'トレーニングを記録して、たまごを温めよう！';
    return ['…ピキッ', 'たまごが少し動いた！', 'もうすぐ生まれそう！'][Math.min(st.lv - 1 + (st.rest > st.need / 2 ? 1 : 0), 2)];
  }
  const msgs = {
    great: ['今日もナイスバルク！', 'まだまだいけるよ！', '筋肉がよろこんでる！', 'プロテイン飲んだ？'],
    ok: ['そろそろトレーニングしない？', '休養も大事だよね', '次はどこ鍛える？'],
    sad: ['さみしいな…', '筋肉がしぼんじゃう…', 'いっしょに動こうよ…'],
    tired: ['zzz…', 'からだが重い…', '一緒にまた始めよう…'],
  };
  const list = msgs[mood.key] || msgs.great;
  return list[(st.total + new Date().getDate()) % list.length];
}

// ===== キャラ描画（SVG） =====
function drawPet(st, mood) {
  const svg = document.getElementById('petSvg');
  const stage = STAGES[st.stageIdx];
  const s = st.stat;
  // 部位ごとのXPから見た目の太さを決める（0〜1）
  const g = v => Math.min(1, Math.sqrt(v / 1500));
  const upper = g(s.chest + s.shoulder + s.back / 2);
  const arm = g(s.arms * 2 + s.chest / 2);
  const leg = g(s.legs * 1.5);
  const core = g(s.core * 3);
  const stamina = g(s.cardio * 2);

  let body = '';
  if (st.stageIdx === 0) {
    // たまご：XPが貯まるほどヒビが入る
    const p = st.rest / st.need + (st.lv - 1);
    const crack = p > 0.3 ? `<path d="M70 95 l10 10 l8 -10 l10 12 l8 -9 l10 10 l10 -9" stroke="#b08060" stroke-width="3" fill="none"/>` : '';
    const crack2 = p > 1.0 ? `<path d="M80 130 l8 -8 l8 8 l9 -7 l9 9" stroke="#b08060" stroke-width="3" fill="none"/>` : '';
    body = `
      <ellipse cx="100" cy="178" rx="45" ry="8" fill="rgba(0,0,0,.08)"/>
      <ellipse cx="100" cy="112" rx="52" ry="66" fill="${stage.color}" stroke="#d9b48a" stroke-width="3"/>
      <circle cx="80" cy="85" r="7" fill="#ffd9a0"/><circle cx="122" cy="120" r="9" fill="#ffd9a0"/><circle cx="92" cy="150" r="5" fill="#ffd9a0"/>
      ${crack}${crack2}`;
  } else {
    const k = st.stageIdx;            // 1〜5
    const scale = 0.74 + k * 0.05;    // 成長で大きくなる
    const bw = 46 + upper * 18;       // 胴の横幅
    const bh = 50 + core * 6;
    const armW = 7 + arm * 12;
    const legW = 9 + leg * 12;
    const c = stage.color;
    const dark = '#c9753f';
    const eyeY = 78;
    const faces = {
      happy:  `<path d="M78 ${eyeY} q6 -8 12 0" stroke="#3a2e2a" stroke-width="4" fill="none" stroke-linecap="round"/>
               <path d="M110 ${eyeY} q6 -8 12 0" stroke="#3a2e2a" stroke-width="4" fill="none" stroke-linecap="round"/>
               <path d="M88 96 q12 12 24 0" stroke="#3a2e2a" stroke-width="4" fill="#ff8080" stroke-linecap="round"/>`,
      normal: `<circle cx="84" cy="${eyeY}" r="5" fill="#3a2e2a"/><circle cx="116" cy="${eyeY}" r="5" fill="#3a2e2a"/>
               <path d="M92 98 h16" stroke="#3a2e2a" stroke-width="4" stroke-linecap="round"/>`,
      sad:    `<circle cx="84" cy="${eyeY + 2}" r="5" fill="#3a2e2a"/><circle cx="116" cy="${eyeY + 2}" r="5" fill="#3a2e2a"/>
               <path d="M76 ${eyeY - 9} l12 4 M124 ${eyeY - 9} l-12 4" stroke="#3a2e2a" stroke-width="3" stroke-linecap="round"/>
               <path d="M90 102 q10 -9 20 0" stroke="#3a2e2a" stroke-width="4" fill="none" stroke-linecap="round"/>
               <path d="M122 86 q4 8 0 12 q-4 -4 0 -12" fill="#7cc3ff"/>`,
      tired:  `<path d="M78 ${eyeY} h12 M110 ${eyeY} h12" stroke="#3a2e2a" stroke-width="4" stroke-linecap="round"/>
               <ellipse cx="100" cy="100" rx="6" ry="4" fill="#3a2e2a"/>
               <text x="132" y="62" font-size="16" fill="#8a7a72">z</text><text x="142" y="48" font-size="12" fill="#8a7a72">z</text>`,
    };
    // 腹筋（体幹XPが一定以上で割れる）
    const abs = core > 0.35 ? `
      <g stroke="${dark}" stroke-width="2.5" opacity="${Math.min(1, core)}" fill="none" stroke-linecap="round">
        <path d="M100 116 v30"/><path d="M90 124 h20"/><path d="M90 136 h20"/>
      </g>` : '';
    // 胸筋
    const pecs = upper > 0.3 ? `<path d="M${100 - bw * 0.55} 112 q${bw * 0.27} 8 ${bw * 0.55} 0 q${bw * 0.28} 8 ${bw * 0.55} 0" stroke="${dark}" stroke-width="2.5" fill="none" opacity="${upper}"/>` : '';
    // ステージごとのアクセサリ
    let acc = '';
    if (k >= 2) acc += `<rect x="62" y="56" width="76" height="9" rx="4" fill="#e74c3c"/><path d="M136 60 l14 -6 l-3 10 z" fill="#e74c3c"/>`; // ハチマキ
    if (k >= 4) acc += `<path d="M78 40 l8 -18 l14 12 l14 -12 l8 18 z" fill="#ffd700" stroke="#d4a017" stroke-width="2"/>`; // 王冠
    const aura = k >= 4 ? `<ellipse cx="100" cy="110" rx="${92 + stamina * 6}" ry="${84 + stamina * 6}" fill="url(#aura)"/>` : '';
    // 有酸素XPで汗のきらめき
    const sweat = stamina > 0.2 && mood.face === 'happy' ? `<path d="M140 70 q5 9 0 14 q-5 -5 0 -14" fill="#7cc3ff"/>` : '';
    const wristband = k >= 3 ? [-1, 1].map(d =>
      `<rect x="${100 + d * (bw + 20) - armW - 1}" y="88" width="${armW * 2 + 2}" height="6" rx="2" fill="#4d96ff"/>`).join('') : '';

    body = `
      <defs>
        <radialGradient id="aura"><stop offset="60%" stop-color="#ffe066" stop-opacity="0"/><stop offset="100%" stop-color="#ffe066" stop-opacity=".55"/></radialGradient>
      </defs>
      ${aura}
      <ellipse cx="100" cy="186" rx="${50 + leg * 10}" ry="8" fill="rgba(0,0,0,.1)"/>
      <g transform="translate(100 186) scale(${scale}) translate(-100 -186)">
        <!-- 脚 -->
        <rect x="${100 - 22 - legW / 2}" y="150" width="${legW}" height="34" rx="${legW / 2}" fill="${c}" stroke="${dark}" stroke-width="2.5"/>
        <rect x="${100 + 22 - legW / 2}" y="150" width="${legW}" height="34" rx="${legW / 2}" fill="${c}" stroke="${dark}" stroke-width="2.5"/>
        <!-- 腕（力こぶポーズ）：太い線を縁取り色→本体色の順に重ねて描く -->
        ${[-1, 1].map(d => {
          const sx = 100 + d * (bw - 8), ex = 100 + d * (bw + 22), fx = 100 + d * (bw + 20);
          const path = `M${sx} 112 L${ex} 114 L${fx} 80`;
          return `<path d="${path}" stroke="${dark}" stroke-width="${armW * 2 + 5}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="${path}" stroke="${c}" stroke-width="${armW * 2}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                  <ellipse cx="${100 + d * (bw + 10)}" cy="${106 - arm * 3}" rx="${armW * 0.9}" ry="${armW * 0.75}" fill="${c}" stroke="${dark}" stroke-width="2.5"/>`;
        }).join('')}
        ${wristband}
        <!-- 胴体（頭と一体のまるいボディ） -->
        <ellipse cx="100" cy="112" rx="${bw}" ry="${bh + 22}" fill="${c}" stroke="${dark}" stroke-width="3"/>
        <ellipse cx="100" cy="130" rx="${bw * 0.6}" ry="${bh * 0.5}" fill="#fff" opacity=".35"/>
        ${pecs}${abs}
        <circle cx="72" cy="92" r="7" fill="#ff9a9a" opacity=".6"/><circle cx="128" cy="92" r="7" fill="#ff9a9a" opacity=".6"/>
        ${faces[mood.face]}
        ${acc}${sweat}
      </g>`;
  }
  svg.innerHTML = body;
  const box = document.getElementById('petBox');
  box.className = mood.face === 'sad' || mood.face === 'tired' ? 'sad' : 'bob';
}

// ===== 画面描画 =====
let lastLv = null, lastStage = null;
function render() {
  const st = computeState();
  const mood = moodOf(st);
  const stage = STAGES[st.stageIdx];

  document.getElementById('todayLabel').textContent = today().replace(/-/g, '/');
  document.getElementById('petName').textContent = data.petName;
  document.getElementById('petStage').textContent = `${stage.name}（Lv ${st.lv}）` +
    (STAGES[st.stageIdx + 1] ? ` ・ Lv ${STAGES[st.stageIdx + 1].lv}で進化` : ' ・ 最終形態！');
  document.getElementById('petTalk').textContent = talkOf(st, mood);
  document.getElementById('levelLabel').textContent = `Lv ${st.lv}`;
  document.getElementById('xpLabel').textContent = `${st.rest} / ${st.need} XP（累計 ${st.total}）`;
  document.getElementById('xpBar').style.width = `${(st.rest / st.need) * 100}%`;
  document.getElementById('moodLabel').textContent = mood.label + (st.idle > 1 ? `（${st.idle}日休み）` : '');
  document.getElementById('streakLabel').textContent = st.streak
    ? `${st.streak}日 🔥 ボーナス+${Math.min(st.streak - 1, 5) * 10}%` : '-';

  const maxStat = Math.max(100, ...Object.values(st.stat));
  document.getElementById('stats').innerHTML = Object.entries(PARTS).map(([k, p]) => `
    <div class="stat" style="--c:${p.color}">
      <div class="row"><span>${p.stat}<small style="color:var(--sub)">（${p.name}）</small></span><b>${st.stat[k]}</b></div>
      <div class="bar"><div style="width:${(st.stat[k] / maxStat) * 100}%"></div></div>
    </div>`).join('');

  document.getElementById('sumDays').textContent = st.days.length;
  document.getElementById('sumSets').textContent = st.sets;
  document.getElementById('sumVolume').textContent = Math.round(st.volume).toLocaleString();

  drawPet(st, mood);
  renderToday(st);
  renderHistory(st);

  // レベルアップ・進化の演出
  const leveled = lastLv !== null && st.lv > lastLv;
  if (leveled) {
    const evolved = st.stageIdx > lastStage;
    toast(evolved ? `✨ 進化した！ ${stage.name} になった！` : `🎉 レベルアップ！ Lv ${st.lv}`);
    const box = document.getElementById('petSvg');
    box.classList.remove('levelup'); void box.getBBox(); box.classList.add('levelup');
  }
  lastLv = st.lv; lastStage = st.stageIdx;
  return leveled;
}

function entryHtml(r) {
  const p = PARTS[r.part];
  const detail = r.part === 'cardio' ? `${r.minutes}分`
    : `${Number(r.weight) ? r.weight + 'kg' : '自重'} × ${r.reps}回 × ${r.sets}セット`;
  return `<div class="entry">
    <div><span class="tag" style="background:${p.color}">${p.name}</span>${esc(r.exercise)}
      <div class="meta">${detail}</div></div>
    <div><span class="xp">+${r._xp}XP</span><button class="mini" data-del="${r.id}">削除</button></div>
  </div>`;
}
function renderToday(st) {
  const d = document.getElementById('fDate').value || today();
  const list = st.recs.filter(r => r.date === d);
  document.getElementById('todayList').innerHTML = list.length
    ? list.map(entryHtml).join('') : '<div class="empty">まだ記録がありません</div>';
}
function renderHistory(st) {
  const byDay = {};
  st.recs.forEach(r => (byDay[r.date] ||= []).push(r));
  const days = Object.keys(byDay).sort().reverse();
  document.getElementById('historyList').innerHTML = days.length ? days.map(d => {
    const xp = byDay[d].reduce((a, r) => a + r._xp, 0);
    return `<div class="day">${d.replace(/-/g, '/')}（+${xp}XP）</div>` + byDay[d].map(entryHtml).join('');
  }).join('') : '<div class="empty">記録するとここに表示されます</div>';

  // 12週間カレンダー（日曜始まり）
  const xpByDay = Object.fromEntries(days.map(d => [d, byDay[d].reduce((a, r) => a + r._xp, 0)]));
  const now = new Date();
  const start = new Date(now); start.setDate(now.getDate() - now.getDay() - 7 * 11);
  let html = '';
  for (let i = 0; i < 84; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const x = xpByDay[ymd(d)] || 0;
    const cls = d > now ? 'style="opacity:.3"' : `class="${x ? (x > 150 ? 'l3' : x > 60 ? 'l2' : 'l1') : ''}"`;
    html += `<div ${cls} title="${ymd(d)} ${x}XP"></div>`;
  }
  document.getElementById('cal').innerHTML = html;
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

// ===== 記録フォーム =====
let currentPart = 'chest';
function renderChips() {
  document.getElementById('partChips').innerHTML = Object.entries(PARTS).map(([k, p]) =>
    `<button class="chip ${k === currentPart ? 'on' : ''}" data-part="${k}">${p.name}</button>`).join('');
  document.getElementById('fExercise').innerHTML =
    PARTS[currentPart].ex.map(e => `<option>${e}</option>`).join('') + '<option value="__custom">その他（自由入力）</option>';
  const cardio = currentPart === 'cardio';
  document.getElementById('weightFields').classList.toggle('hidden', cardio);
  document.getElementById('cardioFields').classList.toggle('hidden', !cardio);
  document.getElementById('fCustom').classList.add('hidden');
  updatePreview();
}
function readForm() {
  const sel = document.getElementById('fExercise').value;
  const exercise = sel === '__custom' ? document.getElementById('fCustom').value.trim() : sel;
  const r = { date: document.getElementById('fDate').value || today(), part: currentPart, exercise };
  if (currentPart === 'cardio') {
    r.minutes = parseInt(document.getElementById('fMinutes').value, 10) || 0;
  } else {
    r.weight = parseFloat(document.getElementById('fWeight').value) || 0;
    r.reps = parseInt(document.getElementById('fReps').value, 10) || 0;
    r.sets = parseInt(document.getElementById('fSets').value, 10) || 0;
  }
  return r;
}
function validRecord(r) {
  if (!r.exercise) return '種目名を入力してください';
  if (r.part === 'cardio') return r.minutes > 0 ? null : '時間を入力してください';
  if (r.reps <= 0) return '回数を入力してください';
  if (r.sets <= 0) return 'セット数を入力してください';
  if (r.weight < 0) return '重量が正しくありません';
  return null;
}
function updatePreview() {
  const r = readForm();
  document.getElementById('xpPreview').textContent = validRecord(r) ? '0 XP' : `${baseXp(r)} XP〜`;
}

document.getElementById('partChips').addEventListener('click', e => {
  const k = e.target.dataset.part; if (!k) return;
  currentPart = k; renderChips();
});
document.getElementById('fExercise').addEventListener('change', e => {
  document.getElementById('fCustom').classList.toggle('hidden', e.target.value !== '__custom');
  updatePreview();
});
['fWeight', 'fReps', 'fSets', 'fMinutes', 'fCustom'].forEach(id =>
  document.getElementById(id).addEventListener('input', updatePreview));
document.getElementById('fDate').addEventListener('change', render);

document.getElementById('saveBtn').addEventListener('click', () => {
  const r = readForm();
  const err = validRecord(r);
  if (err) { toast(err); return; }
  if (r.date > today()) { toast('未来の日付には記録できません'); return; }
  r.id = Date.now();
  const before = computeState().total;
  data.records.push(r);
  save();
  const gained = computeState().total - before;
  if (!render()) toast(`💪 +${gained} XP ゲット！`);
  document.getElementById('fReps').value = '';
});

document.body.addEventListener('click', e => {
  const id = e.target.dataset.del;
  if (!id) return;
  if (!confirm('この記録を削除しますか？')) return;
  data.records = data.records.filter(r => String(r.id) !== id);
  save(); lastLv = null; render();
});

document.getElementById('renameBtn').addEventListener('click', () => {
  const n = prompt('キャラの名前', data.petName);
  if (n && n.trim()) { data.petName = n.trim().slice(0, 20); save(); render(); }
});

// ===== データ管理 =====
document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `muscle-pet-${today()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
});
document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.records)) throw new Error();
    if (!confirm(`${d.records.length}件の記録で上書きします。よろしいですか？`)) return;
    data = { petName: d.petName || 'マッスルくん', records: d.records };
    save(); lastLv = null; render(); toast('復元しました');
  } catch { toast('ファイルを読み込めませんでした'); }
  e.target.value = '';
});
document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('すべての記録とキャラが消えます。本当に削除しますか？')) return;
  data = { petName: data.petName, records: [] };
  save(); lastLv = null; render(); toast('リセットしました');
});

// ===== タブ =====
document.querySelector('nav').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  ['home', 'log', 'history'].forEach(t =>
    document.getElementById('tab-' + t).classList.toggle('hidden', t !== b.dataset.tab));
  window.scrollTo(0, 0);
});

// ===== 起動 =====
document.getElementById('fDate').value = today();
renderChips();
render();
</script>
</body>
</html>
