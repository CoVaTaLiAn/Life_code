<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>マッスルモンスター - 筋トレ記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07070b;
    --card: #101018;
    --card2: #16161f;
    --text: #e9e9f2;
    --sub: #7d7d92;
    --line: #23232f;
    --cyan: #00f0ff;
    --pink: #ff2bd6;
    --lime: #b6ff3b;
    --accent: var(--cyan);
    --bad: #ff4d6d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background:
      radial-gradient(ellipse at 20% -10%, rgba(0, 240, 255, .10), transparent 50%),
      radial-gradient(ellipse at 100% 10%, rgba(255, 43, 214, .08), transparent 45%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    padding-bottom: calc(68px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  header {
    max-width: 560px; margin: 0 auto;
    padding: 18px 16px 6px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .pixel { font-family: "DotGothic16", monospace; font-weight: 400; }
  .logo {
    font-family: "DotGothic16", monospace; font-weight: 400; font-size: 19px; letter-spacing: .14em;
    color: var(--cyan); text-shadow: 0 0 8px rgba(0, 240, 255, .7), 0 0 22px rgba(0, 240, 255, .35);
  }
  .logo b { color: var(--pink); text-shadow: 0 0 8px rgba(255, 43, 214, .7), 0 0 22px rgba(255, 43, 214, .35); font-weight: 400; }
  header small { color: var(--sub); font-size: 12px; letter-spacing: .08em; font-variant-numeric: tabular-nums; }
  main { max-width: 560px; margin: 0 auto; padding: 0 12px; }
  .card {
    background: linear-gradient(180deg, var(--card2), var(--card));
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin: 10px 0;
  }
  .card h2 {
    font-size: 11px; margin: 0 0 12px; letter-spacing: .2em; text-transform: uppercase;
    color: var(--sub); font-weight: 600;
  }
  .hidden { display: none !important; }

  /* キャラ */
  .pet-wrap { text-align: center; position: relative; overflow: hidden; }
  .pet-wrap::before {
    content: ""; position: absolute; left: 50%; bottom: 96px; width: 280px; height: 60px; transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(0, 240, 255, .18), transparent 70%);
  }
  .char-picker { justify-content: center; position: relative; z-index: 1; }
  .char-picker .chip { padding: 4px 12px; font-size: 12px; }
  .pet-name { font-size: 20px; font-weight: 700; margin: 4px 0 0; letter-spacing: .04em; }
  .pet-stage { color: var(--cyan); font-size: 12px; letter-spacing: .1em; margin-top: 2px; }
  #petCanvas { width: 256px; height: 236px; position: relative; image-rendering: pixelated; image-rendering: crisp-edges; display: block; margin: 0 auto; }
  .bubble {
    display: inline-block; margin-top: 10px;
    border: 1px solid rgba(255, 43, 214, .55); color: #ffd6f6;
    border-radius: 999px; padding: 6px 16px; font-size: 13px;
    box-shadow: 0 0 12px rgba(255, 43, 214, .25), inset 0 0 10px rgba(255, 43, 214, .08);
  }
  .bob { animation: bob 2.2s ease-in-out infinite; }
  .sad { animation: sad 4s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
  @keyframes sad { 0%,100% { transform: translateY(0) } 50% { transform: translateY(2px) } }
  .levelup { animation: pop .8s ease; }
  @keyframes pop { 0% { transform: scale(1) } 40% { transform: scale(1.15) } 100% { transform: scale(1) } }

  .bar { height: 8px; background: #1d1d28; border-radius: 4px; overflow: hidden; }
  .bar > div {
    height: 100%; border-radius: 4px; transition: width .6s;
    background: linear-gradient(90deg, var(--cyan), var(--pink));
    box-shadow: 0 0 10px rgba(0, 240, 255, .6);
  }
  .row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin: 6px 0; }
  .row > span:first-child { color: var(--sub); }
  .lv { font-family: "DotGothic16", monospace; font-size: 30px; font-weight: 400; letter-spacing: .02em; color: #fff; }
  .lv small { font-size: 12px; color: var(--sub); font-weight: 600; letter-spacing: .2em; margin-right: 6px; }
  .num { font-variant-numeric: tabular-nums; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .stat .row { margin: 0 0 5px; }
  .stat .row b { color: #fff; font-variant-numeric: tabular-nums; }
  .stat .bar { height: 4px; }
  .stat .bar > div { background: var(--c); box-shadow: 0 0 8px var(--c); }
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; gap: 6px; }
  .summary b { display: block; font-size: 22px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
  .summary span { font-size: 10px; color: var(--sub); letter-spacing: .1em; }

  /* フォーム */
  label { display: block; font-size: 11px; color: var(--sub); margin: 12px 0 5px; letter-spacing: .1em; }
  input, select, button { font: inherit; }
  input, select {
    width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: #0b0b11; color: var(--text); outline: none; color-scheme: dark;
  }
  input:focus, select:focus { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan), 0 0 14px rgba(0, 240, 255, .25); }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .btn {
    display: block; width: 100%; margin-top: 16px; padding: 14px;
    border: 1px solid var(--cyan); border-radius: 12px; cursor: pointer;
    background: rgba(0, 240, 255, .08); color: var(--cyan);
    font-weight: 700; font-size: 15px; letter-spacing: .12em;
    text-shadow: 0 0 8px rgba(0, 240, 255, .7);
    box-shadow: 0 0 16px rgba(0, 240, 255, .25), inset 0 0 14px rgba(0, 240, 255, .12);
    transition: background .2s;
  }
  .btn:active { background: rgba(0, 240, 255, .2); }
  .btn.sub {
    border-color: var(--line); background: transparent; color: var(--text);
    font-weight: 500; font-size: 13px; letter-spacing: .05em; text-shadow: none; box-shadow: none; margin-top: 10px;
  }
  .btn.danger { color: var(--bad); border-color: rgba(255, 77, 109, .4); }
  .mini {
    border: 1px solid var(--line); background: transparent; color: var(--sub);
    border-radius: 8px; padding: 3px 9px; font-size: 11px; cursor: pointer;
  }
  .mini:hover { color: var(--text); border-color: var(--sub); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--line); background: transparent; color: var(--sub);
    border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer;
  }
  .chip.on { color: var(--c); border-color: var(--c); box-shadow: 0 0 10px var(--c), inset 0 0 8px rgba(255,255,255,.04); text-shadow: 0 0 6px var(--c); }
  .guide { margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; background: #0b0b11; }
  .guide summary {
    list-style: none; cursor: pointer; padding: 10px 12px; font-size: 13px; color: var(--cyan);
    display: flex; justify-content: space-between; gap: 8px;
  }
  .guide summary::-webkit-details-marker { display: none; }
  .guide summary::after { content: "やり方 ▼"; color: var(--sub); font-size: 11px; white-space: nowrap; }
  .guide[open] summary::after { content: "とじる ▲"; }
  .guide summary.empty-guide { color: var(--sub); }
  .guide summary.empty-guide::after { content: ""; }
  #guideBody { padding: 0 12px 12px; font-size: 13px; line-height: 1.7; }
  #guideBody h4 { margin: 10px 0 2px; font-size: 11px; letter-spacing: .12em; color: var(--sub); font-weight: 600; }
  #guideBody ol, #guideBody ul { margin: 0; padding-left: 1.3em; }
  #guideBody li::marker { color: var(--cyan); }
  .lvl { display: inline-block; font-size: 10px; padding: 0 6px; border-radius: 4px; margin-left: 6px; border: 1px solid currentColor; vertical-align: 1px; }
  .lvl1 { color: var(--lime); } .lvl2 { color: #ff9f1c; } .lvl3 { color: var(--pink); }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
  .btn-row .btn { margin-top: 0; font-size: 14px; letter-spacing: .06em; padding: 13px 8px; }
  .btn.ghost { background: transparent; box-shadow: none; text-shadow: none; }
  .btn.pink {
    border-color: var(--pink); color: var(--pink); background: rgba(255, 43, 214, .08);
    text-shadow: 0 0 8px rgba(255, 43, 214, .7);
    box-shadow: 0 0 16px rgba(255, 43, 214, .25), inset 0 0 14px rgba(255, 43, 214, .12);
  }
  .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .card-head h2 { margin: 0; }
  .count {
    display: inline-block; min-width: 18px; padding: 0 6px; margin-left: 6px; border-radius: 9px;
    background: var(--pink); color: #fff; font-size: 11px; line-height: 18px; text-align: center; letter-spacing: 0;
  }
  .xp-preview { color: var(--lime); text-shadow: 0 0 8px rgba(182, 255, 59, .6); font-variant-numeric: tabular-nums; }

  /* 履歴 */
  .day { margin: 16px 0 4px; font-weight: 600; font-size: 11px; color: var(--sub); letter-spacing: .12em; }
  .entry {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14px;
  }
  .entry .meta { color: var(--sub); font-size: 12px; margin-top: 2px; }
  .entry .xp { color: var(--lime); font-weight: 700; font-size: 12px; margin-right: 8px; font-variant-numeric: tabular-nums; }
  .tag {
    display: inline-block; font-size: 10px; padding: 1px 7px; border-radius: 4px; margin-right: 6px;
    color: var(--c); border: 1px solid var(--c); letter-spacing: .05em;
  }
  .empty { text-align: center; color: var(--sub); padding: 24px 0; font-size: 13px; }
  .cal { display: grid; grid-template-columns: repeat(12, 1fr); grid-template-rows: repeat(7, auto); grid-auto-flow: column; gap: 4px; }
  .cal div { aspect-ratio: 1; border-radius: 3px; background: #191922; }
  .cal div.l1 { background: rgba(0, 240, 255, .25); }
  .cal div.l2 { background: rgba(0, 240, 255, .55); }
  .cal div.l3 { background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }

  /* データ */
  .chart { width: 100%; height: auto; display: block; overflow: visible; }
  .chart text { font-size: 9px; fill: var(--sub); font-family: inherit; }
  .seg { display: flex; gap: 6px; }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .filters input { grid-column: 1 / -1; }
  .filters select, .filters input { padding: 8px 10px; font-size: 13px; }
  .table-wrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
  table.db { width: 100%; border-collapse: collapse; font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  table.db th {
    text-align: left; color: var(--sub); font-weight: 600; font-size: 11px; letter-spacing: .06em;
    padding: 8px 8px 8px 0; border-bottom: 1px solid var(--line); cursor: pointer; user-select: none;
  }
  table.db th.sorted { color: var(--cyan); }
  table.db td { padding: 8px 8px 8px 0; border-bottom: 1px solid var(--line); }
  table.db td.n, table.db th.n { text-align: right; }
  .db-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--sub); margin: 4px 0 8px; }
  .share-row { display: flex; align-items: center; gap: 10px; margin: 7px 0; font-size: 13px; }
  .share-row .name { width: 52px; color: var(--sub); }
  .share-row .bar { flex: 1; height: 8px; }
  .share-row .bar > div { background: var(--c); box-shadow: 0 0 8px var(--c); }
  .share-row .pct { width: 74px; text-align: right; font-variant-numeric: tabular-nums; }

  /* タブ */
  nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; background: rgba(7, 7, 11, .85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1; border: none; background: none; padding: 16px 0 14px; cursor: pointer;
    font-size: 11px; letter-spacing: .22em; color: var(--sub); font-weight: 600; position: relative;
  }
  nav button.on { color: var(--cyan); text-shadow: 0 0 8px rgba(0, 240, 255, .7); }
  nav button.on::after {
    content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 2px;
    background: var(--cyan); box-shadow: 0 0 10px var(--cyan);
  }

  /* トースト */
  #toast {
    position: fixed; left: 50%; top: 18px; transform: translateX(-50%);
    background: rgba(10, 10, 16, .92); color: var(--lime);
    border: 1px solid var(--lime); box-shadow: 0 0 18px rgba(182, 255, 59, .35);
    padding: 10px 20px; border-radius: 999px; font-size: 13px; font-weight: 600; letter-spacing: .06em;
    opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 10; text-align: center; max-width: 90%;
  }
  #toast.show { opacity: 1; }

  /* ダイアログ */
  #modal {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .65); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); padding: 24px;
  }
  #modal .box {
    width: 100%; max-width: 340px; background: var(--card2); border: 1px solid rgba(0, 240, 255, .4);
    border-radius: 16px; padding: 20px; box-shadow: 0 0 30px rgba(0, 240, 255, .18);
  }
  #modal p { margin: 0 0 4px; font-size: 14px; line-height: 1.6; }
  #modal .actions { display: flex; gap: 8px; margin-top: 16px; }
  #modal .actions .btn { margin-top: 0; padding: 11px; font-size: 14px; }
</style>
</head>
<body>
<header>
  <div class="logo">MUSCLE<b>MONSTER</b></div>
  <small id="todayLabel"></small>
</header>

<main>
  <!-- ホーム -->
  <section id="tab-home">
    <div class="card pet-wrap">
      <div class="chips char-picker" id="charPicker"></div>
      <div id="petBox"><canvas id="petCanvas" width="64" height="59"></canvas></div>
      <div class="pet-name"><span id="petName" class="pixel"></span> <button class="mini" id="renameBtn">名前変更</button></div>
      <div class="pet-stage pixel" id="petStage"></div>
      <div class="bubble pixel" id="petTalk"></div>
    </div>

    <div class="card">
      <div class="row"><span class="lv" id="levelLabel"></span><span id="xpLabel" class="num" style="color:var(--sub)"></span></div>
      <div class="bar"><div id="xpBar" style="width:0"></div></div>
      <div class="row" style="margin-top:12px"><span>きげん</span><span id="moodLabel"></span></div>
      <div class="row"><span>連続トレーニング</span><span id="streakLabel"></span></div>
    </div>

    <div class="card">
      <h2>ステータス</h2>
      <div class="stats" id="stats"></div>
    </div>

    <div class="card">
      <h2>これまでの記録</h2>
      <div class="summary">
        <div><b id="sumDays">0</b><span>トレーニング日数</span></div>
        <div><b id="sumSets">0</b><span>総セット数</span></div>
        <div><b id="sumVolume">0</b><span>総回数</span></div>
      </div>
    </div>
  </section>

  <!-- 記録 -->
  <section id="tab-log" class="hidden">
    <div class="card">
      <h2>トレーニングを記録</h2>
      <label>日付</label>
      <input type="date" id="fDate">
      <label>部位</label>
      <div class="chips" id="partChips"></div>
      <label>種目</label>
      <select id="fExercise"></select>
      <input id="fCustom" class="hidden" placeholder="種目名を入力" style="margin-top:6px">
      <details class="guide" id="guide">
        <summary><span id="guideSummary"></span></summary>
        <div id="guideBody"></div>
      </details>
      <div id="weightFields">
        <div class="grid3">
          <div><label id="repsLabel">回数</label><input type="number" id="fReps" inputmode="numeric" min="1" placeholder="10"></div>
          <div><label>セット数</label><input type="number" id="fSets" inputmode="numeric" min="1" value="3"></div>
          <div><label>加重(kg)・任意</label><input type="number" id="fWeight" inputmode="decimal" min="0" step="0.5" placeholder="なし"></div>
        </div>
      </div>
      <div id="cardioFields" class="hidden">
        <label>時間(分)</label><input type="number" id="fMinutes" inputmode="numeric" min="1" placeholder="30">
      </div>
      <div class="row" style="margin-top:10px"><span>獲得予定XP</span><b id="xpPreview" class="xp-preview">0 XP</b></div>
      <div class="btn-row">
        <button class="btn ghost" id="addBtn">リストに追加</button>
        <button class="btn" id="saveBtn">今すぐ記録</button>
      </div>
    </div>
    <div class="card" id="draftCard">
      <div class="card-head">
        <h2>まとめて記録<span class="count" id="draftCount">0</span></h2>
        <button class="mini" id="loadLastBtn">前回のメニューを読み込む</button>
      </div>
      <div id="draftList"></div>
      <div id="draftFoot" class="hidden">
        <div class="row" style="margin-top:12px"><span>合計XP</span><b id="draftXp" class="xp-preview">0 XP</b></div>
        <div class="btn-row">
          <button class="btn sub" id="draftClearBtn" style="margin-top:0">リストを空にする</button>
          <button class="btn pink" id="draftSaveBtn">まとめて記録する</button>
        </div>
      </div>
    </div>
    <div class="card">
      <h2>今日の記録</h2>
      <div id="todayList"></div>
    </div>
  </section>

  <!-- 履歴 -->
  <section id="tab-data" class="hidden">
    <div class="card">
      <div class="card-head"><h2>XPの推移</h2>
        <div class="seg" id="xpRange">
          <button class="chip on" style="--c:var(--cyan)" data-range="30">30日</button>
          <button class="chip" style="--c:var(--cyan)" data-range="12w">12週</button>
          <button class="chip" style="--c:var(--cyan)" data-range="all">累計</button>
        </div>
      </div>
      <div id="xpChart"></div>
    </div>
    <div class="card">
      <h2>部位別の割合（XP）</h2>
      <div id="partShare"></div>
    </div>
    <div class="card">
      <h2>週ごとの総回数</h2>
      <div id="volumeChart"></div>
    </div>
    <div class="card">
      <div class="card-head"><h2>種目別の伸び</h2></div>
      <select id="exSelect" style="margin:6px 0 10px"></select>
      <div id="exChart"></div>
    </div>
    <div class="card">
      <h2>データベース</h2>
      <div class="filters">
        <select id="dbPart"><option value="">すべての部位</option></select>
        <select id="dbEx"><option value="">すべての種目</option></select>
        <input id="dbSearch" placeholder="種目名で検索">
      </div>
      <div class="db-meta"><span id="dbCount"></span><button class="mini" id="csvBtn">CSVをコピー</button></div>
      <div class="table-wrap"><table class="db" id="dbTable"></table></div>
      <button class="btn sub hidden" id="dbMore">もっと見る</button>
    </div>
  </section>

  <section id="tab-history" class="hidden">
    <div class="card">
      <h2>直近12週間</h2>
      <div class="cal" id="cal"></div>
    </div>
    <div class="card">
      <h2>履歴</h2>
      <div id="historyList"></div>
    </div>
    <div class="card">
      <h2>データ管理</h2>
      <button class="btn sub" id="exportBtn">バックアップを保存（JSON）</button>
      <button class="btn sub" id="copyBtn">バックアップをコピー</button>
      <button class="btn sub" id="importBtn">バックアップから復元</button>
      <input type="file" id="importFile" accept="application/json" class="hidden">
      <button class="btn sub danger" id="resetBtn">すべてのデータを削除</button>
    </div>
  </section>
</main>

<nav>
  <button data-tab="home" class="on">HOME</button>
  <button data-tab="log">LOG</button>
  <button data-tab="data">DATA</button>
  <button data-tab="history">HISTORY</button>
</nav>

<div id="toast"></div>

<div id="modal" class="hidden">
  <div class="box">
    <p id="modalMsg"></p>
    <input id="modalInput" class="hidden" maxlength="20" style="margin-top:10px">
    <div class="actions">
      <button class="btn sub" id="modalCancel">キャンセル</button>
      <button class="btn" id="modalOk">OK</button>
    </div>
  </div>
</div>

<script>
// ===== 定義 =====
const PARTS = {
  chest:    { name: '胸',     stat: 'パワー',     color: '#ff2bd6' },
  back:     { name: '背中',   stat: 'タフさ',     color: '#3d7bff' },
  legs:     { name: '脚',     stat: 'ふんばり',   color: '#39ff88' },
  shoulder: { name: '肩',     stat: 'かまえ',     color: '#ff9f1c' },

function load() {
  try {

    if (d && Array.isArray(d.records)) {
      if (!Array.isArray(d.draft)) d.draft = [];
      // 旧形式からの移行
      if (!d.names) d.names = {};
      delete d.petName;
      if (!CHARS[d.char]) d.char = 'wolf'; // 廃止したキャラ（パンダ・おばけ）はウルフに
      return d;
    }
  } catch (e) {}
  return { char: 'wolf', names: {}, records: [], draft: [] };
}

// ===== ダイアログ（ブラウザ標準の confirm / prompt の代わり） =====
function dialog(msg, { input = null, danger = false } = {}) {
  const m = document.getElementById('modal');
  const inp = document.getElementById('modalInput');
  const ok = document.getElementById('modalOk');
  document.getElementById('modalMsg').textContent = msg;
  inp.classList.toggle('hidden', input === null);
  inp.value = input ?? '';
  ok.classList.toggle('danger', danger);
  m.classList.remove('hidden');
  if (input !== null) setTimeout(() => inp.focus(), 50);
  return new Promise(resolve => {
    const close = v => {
      m.classList.add('hidden');
      ok.onclick = cancel.onclick = inp.onkeydown = m.onclick = null;
      resolve(v);
    };
    const cancel = document.getElementById('modalCancel');
    ok.onclick = () => close(input === null ? true : inp.value);
    cancel.onclick = () => close(input === null ? false : null);
    inp.onkeydown = e => { if (e.key === 'Enter') ok.onclick(); };
    m.onclick = e => { if (e.target === m) cancel.onclick(); };
  });
}

// 1種目あたりのXP（連続日数ボーナスは別）
function baseXp(r) {
  if (r.part === 'cardio') return Math.round(5 + r.minutes * 1.5);
  const w = Number(r.weight) || 0;
  const n = r.sec ? r.reps / 3 : r.reps;       // 秒数の種目は3秒を1回ぶんとして計算
  return Math.round(5 + r.sets * n * (1 + w / 25) * 0.5);
}

  const recs = [...data.records].sort((a, b) => a.date.localeCompare(b.date) || a.id - b.id);
  const days = [...new Set(recs.map(r => r.date))].sort();
  // 日ごとの連続日数（その日まで何日続いているか）
  const streakOf = {};
  days.forEach((d, i) => {
    streakOf[d] = (i > 0 && dayDiff(days[i - 1], d) === 1) ? streakOf[days[i - 1]] + 1 : 1;
  });
  let total = 0, sets = 0, volume = 0;
  const stat = Object.fromEntries(Object.keys(PARTS).map(k => [k, 0]));
  for (const r of recs) {
    const bonus = 1 + Math.min(streakOf[r.date] - 1, 5) * 0.1; // 連続日数で最大+50%
    r._xp = Math.round(baseXp(r) * bonus);
    total += r._xp;
    stat[r.part] += r._xp;
    if (r.part !== 'cardio') { sets += r.sets; if (!r.sec) volume += r.reps * r.sets; }
  }
  let lv = 1, rest = total;
  while (rest >= xpForNext(lv)) { rest -= xpForNext(lv); lv++; }
  const last = days[days.length - 1];
  const idle = last ? dayDiff(last, today()) : null;
  let streak = 0;
  if (last && idle <= 1) streak = streakOf[last];
  const stageIdx = STAGES.reduce((acc, s, i) => lv >= s.lv ? i : acc, 0);
  return { total, lv, rest, need: xpForNext(lv), stat, sets, volume, days, idle, streak, stageIdx, recs };
}

function moodOf(st) {
  if (st.idle === null) return { key: 'new', label: 'わくわく', face: 'happy' };
  if (st.idle <= 1) return { key: 'great', label: 'ゴキゲン！', face: 'happy' };
  if (st.idle <= 3) return { key: 'ok', label: 'ふつう', face: 'normal' };
  if (st.idle <= 6) return { key: 'sad', label: 'しょんぼり…', face: 'sad' };
  return { key: 'tired', label: 'ぐったり…', face: 'tired' };
}

function talkOf(st, mood) {
  const c = CHARS[charOf()];
  if (st.stageIdx === 0) {
    if (st.idle === null) return c.egg[0];
    return c.egg[1 + Math.min(st.lv - 1 + (st.rest > st.need / 2 ? 1 : 0), 2)];
  }
  const key = COMMON_TALK[mood.key] ? mood.key : 'great';
  const list = [...COMMON_TALK[key], ...(c.talk[key] || [])];
  return list[(st.total + new Date().getDate()) % list.length];
}

function drawPet(st, mood) {
  const s = st.stat;
  // 部位ごとのXPから見た目を決める（0〜1）
  const g = v => Math.min(1, Math.sqrt(v / 1500));
  const k = st.stageIdx;                         // 0（たまご）〜5
  const upper = g(s.chest + s.shoulder + s.back / 2);
  const arm = g(s.arms * 2 + s.chest / 2);
  const leg = g(s.legs * 1.5);
  const core = g(s.core * 3);
  const P = {
    k, upper, arm, leg, core,
    stamina: g(s.cardio * 2),
    scale: 0.76 + k * 0.05,                      // 成長で大きくなる
    hs: 1.06 - k * 0.035,                        // 子どもほど頭が大きい
    S: 23 + k * 1.5 + upper * 12,                // 肩幅（胸・肩・背中）
    Wt: 17 + k * 0.8 + core * 1.5,               // ウエスト（シュッと細め）
    Hp: 21 + k * 0.8 + leg * 3,                  // 腰
    A: 6 + k * 0.6 + arm * 6,                    // 腕の太さ
    L: 9 + k * 0.6 + leg * 5,                    // 脚の太さ
  };
  const draw = { wolf: drawWolf, franken: drawFranken, axolotl: drawAxolotl }[charOf()];
  pixelate(PET_DEFS + draw(st, mood, P));
  const box = document.getElementById('petBox');
  box.className = mood.face === 'sad' || mood.face === 'tired' ? 'sad' : 'bob';
}

// ---- ドット絵化 ----
// ベクターで描いたキャラを 64×59 ドットに縮小して描き、色数を減らしてから4倍に拡大表示する
const PX_W = 64, PX_H = 59, VIEW = '-4 8 208 192';
let pixelJob = 0;
function pixelate(inner) {
  const job = ++pixelJob;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${PX_W}" height="${PX_H}" viewBox="${VIEW}">${inner}</svg>`;
  const img = new Image();
  img.onload = () => {
    if (job !== pixelJob) return; // もっと新しい描画が始まっていたら捨てる
    const cv = document.getElementById('petCanvas');
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    ctx.clearRect(0, 0, PX_W, PX_H);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, 0, 0, PX_W, PX_H);
    let im;
    try { im = ctx.getImageData(0, 0, PX_W, PX_H); } catch (e) { return; } // 読めない環境では縮小表示のみ
    const d = im.data;
    const q = v => Math.min(255, Math.round(v / 36) * 36);   // 1チャンネル8段階に減色
    for (let y = 0; y < PX_H; y++) for (let x = 0; x < PX_W; x++) {
      const i = (y * PX_W + x) * 4, a = d[i + 3] / 255;
      if (a === 0) continue;
      // 半透明（光やオーラ）は消して、輪郭をくっきりさせる
      if (a < 0.55) { d[i + 3] = 0; continue; }
      const k = 1 / a;
      d[i] = q(d[i] * k); d[i + 1] = q(d[i + 1] * k); d[i + 2] = q(d[i + 2] * k); d[i + 3] = 255;
    }
    // 外周に1ドットの黒いふち
    const out = new Uint8ClampedArray(d);
    for (let y = 0; y < PX_H; y++) for (let x = 0; x < PX_W; x++) {
      const i = (y * PX_W + x) * 4;
      if (d[i + 3]) continue;
      const n = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => {
        const xx = x + dx, yy = y + dy;
        return xx >= 0 && yy >= 0 && xx < PX_W && yy < PX_H && d[(yy * PX_W + xx) * 4 + 3];
      });
      if (n) { out[i] = 6; out[i + 1] = 6; out[i + 2] = 12; out[i + 3] = 255; }
    }
    ctx.putImageData(new ImageData(out, PX_W, PX_H), 0, 0);
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

// ===== ウルフ：ふさふさの毛並みと金色の瞳 =====
function drawWolf(st, mood, P) {
  const { k, S, A, Hp } = P;
  const fur = 'url(#wolfFur)', light = 'url(#wolfLight)';
  if (k === 0) return cuteEgg(st, EGG_STYLE.wolf);

  const B = humanoid(P, { skin: fur, belly: light, id: 'wolfTorso' });
  const tail = `M${100 + Hp - 6} 160 C${138 + Hp * 0.3} 172 ${160} 150 ${164} 124 C${168} 108 ${158} 98 ${152} 108 C${156} 130 ${140} 148 ${100 + Hp - 8} 148 Z`;
  const E = 5.4;
  const faces = {
    happy:  `<path d="M78.5 75 q5.5 -6.5 11 0 M110.5 75 q5.5 -6.5 11 0" stroke="#1d2230" stroke-width="2.4" fill="none" stroke-linecap="round"/>
             <path d="M90 94 Q100 106 110 94 Z" fill="#3a1420"/><path d="M92 94.5 l2.2 4 l2 -4 Z M104 94.5 l2 4 l2.2 -4 Z" fill="#fff"/>`,
    normal: `${eye(84, 74, E, 'wolfEye')}${eye(116, 74, E, 'wolfEye')}
             <path d="M100 90 v3 M93 94 q3.5 3 7 -1 q3.5 4 7 1" stroke="#1d2230" stroke-width="1.6" fill="none" stroke-linecap="round"/>
             <path d="M94 95.5 l1.6 3 l1.4 -3 Z M103 95.5 l1.4 3 l1.6 -3 Z" fill="#fff"/>`,
    sad:    `${eye(84, 76, E * 0.9, 'wolfEye')}${eye(116, 76, E * 0.9, 'wolfEye')}
             <path d="M76 66 l12 3 M124 66 l-12 3" stroke="#1d2230" stroke-width="2" stroke-linecap="round"/>
             <path d="M94 98 q6 -5 12 0" stroke="#1d2230" stroke-width="1.6" fill="none" stroke-linecap="round"/>${tearDrop(121, 84)}`,
    tired:  `${eye(84, 75, E * 0.85, 'wolfEye')}${eye(116, 75, E * 0.85, 'wolfEye')}
             <path d="M78.5 75 A5.5 5.5 0 0 1 89.5 75 Z M110.5 75 A5.5 5.5 0 0 1 121.5 75 Z" fill="#6d7488"/>
             <path d="M78.5 75 h11 M110.5 75 h11" stroke="#2a2f3e" stroke-width="1.2"/>
             <ellipse cx="100" cy="96" rx="2.6" ry="2" fill="#1d2230"/>${zzz(138, 50)}`,
  };
  let acc = '';
  if (k >= 2) acc += neonHeadband(62, 58, 100, 42, 138, 58);
  if (k >= 4) acc += neonCrown(100, 30);
  const wrist = k >= 3 ? [-1, 1].map(d => neonWrist(100 + d * (S + 20.5), 101, A * 1.7)).join('') : '';
  // レジェンドは背中に満月
  const moon = k >= 5 ? `<g filter="url(#glow)"><circle cx="146" cy="52" r="20" fill="rgba(255,230,120,.12)" stroke="#ffe066" stroke-width="2"/>
    <circle cx="140" cy="46" r="3" fill="none" stroke="#ffe066" stroke-width="1" opacity=".6"/><circle cx="152" cy="58" r="4" fill="none" stroke="#ffe066" stroke-width="1" opacity=".6"/></g>` : '';
  const cheekTuft = d => `M${100 + d * 34} 72 L${100 + d * 50} 84 L${100 + d * 40} 86 L${100 + d * 52} 96 L${100 + d * 38} 96 L${100 + d * 44} 106 L${100 + d * 26} 100 Z`;
  return humanoidFrame(P, {
    behind: moon,
    bodyFilter: 'fur',
    body: `<path d="${tail}" fill="${fur}"/><path d="M152 108 C158 98 168 108 164 124 C160 116 156 112 152 108 Z" fill="${light}"/>
      ${B.legs}${B.arms}${B.clip}<path d="${B.torso}" fill="${fur}"/>${B.bellyFill}<path d="${B.torso}" fill="url(#rimLight)"/>`,
    overBody: `<g clip-path="url(#wolfTorso)">${B.pecs}${B.abs}</g>${B.armShine}${wrist}`,
    head: `
      <g filter="url(#fur)">
        <path d="M60 66 L66 26 L90 50 Z M140 66 L134 26 L110 50 Z" fill="${fur}"/>
        <path d="${cheekTuft(-1)}" fill="${fur}"/><path d="${cheekTuft(1)}" fill="${fur}"/>
        <ellipse cx="100" cy="74" rx="38" ry="33" fill="${fur}"/>
        <ellipse cx="100" cy="78" rx="40" ry="29" fill="url(#rimLight)"/>
      </g>
      <path d="M66 58 L68 36 L82 52 Z M134 58 L132 36 L118 52 Z" fill="#d9a0b4" opacity=".7"/>
      <ellipse cx="84" cy="66" rx="9" ry="4" fill="#eef1f6" opacity=".85"/><ellipse cx="116" cy="66" rx="9" ry="4" fill="#eef1f6" opacity=".85"/>
      <path d="M100 56 C90 70 82 84 84 94 C88 104 112 104 116 94 C118 84 110 70 100 56 Z" fill="${light}"/>
      <path d="M92.5 84 Q100 79.5 107.5 84 Q105.5 91.5 100 91.5 Q94.5 91.5 92.5 84 Z" fill="#111118"/>
      <ellipse cx="98" cy="83.6" rx="2.6" ry="1.1" fill="#fff" opacity=".55"/>
      <ellipse cx="70" cy="92" rx="6" ry="3.4" fill="#ff8fb8" opacity=".4" filter="url(#soft)"/>
      <ellipse cx="130" cy="92" rx="6" ry="3.4" fill="#ff8fb8" opacity=".4" filter="url(#soft)"/>
      ${faces[mood.face]}${acc}`,
    after: sweatOf(P, mood),
  });
}

// ===== フランケンシュタイン：縫い目とボルト、緑の肌 =====
function drawFranken(st, mood, P) {
  const { k, S, A, Hp, Wt } = P;
  const skin = 'url(#frSkin)';
  const stitch = (x1, y1, x2, y2, n = 4) => {
    let t = `<path d="M${x1} ${y1} L${x2} ${y2}" stroke="#2c4a35" stroke-width="1.4" stroke-linecap="round"/>`;
    const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy), nx = -dy / len * 3, ny = dx / len * 3;
    for (let i = 1; i < n; i++) { const x = x1 + dx * i / n, y = y1 + dy * i / n;
      t += `<path d="M${x - nx} ${y - ny} L${x + nx} ${y + ny}" stroke="#2c4a35" stroke-width="1.3" stroke-linecap="round"/>`; }
    return t;
  };
  const glowBolt = mood.face === 'happy' || mood.face === 'normal';
  const bolt = (x, y, d) => `<rect x="${x - (d < 0 ? 9 : 0)}" y="${y - 4}" width="9" height="8" rx="2" fill="url(#metal)"/>
    <circle cx="${x + d * 10}" cy="${y}" r="3.2" fill="${glowBolt ? NEON : '#7a8494'}" ${glowBolt ? 'filter="url(#glow)"' : ''}/>`;
  if (k === 0) return cuteEgg(st, EGG_STYLE.franken);

  const B = humanoid(P, { skin, limb: skin, foot: 'url(#boot)', muscle: 'url(#muscleG)', muscleLine: '#3f6b4a', id: 'frTorso' });
  // 半ズボン＋ブーツ
  const shorts = `<path d="M${100 - Wt - 2} 154 L${100 + Wt + 2} 154 L${100 + Hp + 3} 172 L${100 + 4} 174 L100 166 L${100 - 4} 174 L${100 - Hp - 3} 172 Z" fill="url(#frPants)"/>
    <path d="M${100 - Wt - 2} 155 L${100 + Wt + 2} 155" stroke="#6b4ad6" stroke-width="2"/>`;
  const E = 5;
  const faces = {
    happy:  `<path d="M79 77 q5 -6 10 0 M111 77 q5 -6 10 0" stroke="#16261b" stroke-width="2.4" fill="none" stroke-linecap="round"/>
             <path d="M90 93 Q100 103 110 93 Z" fill="#1d2a20"/>`,
    normal: `${eye(84, 77, E, 'axEyeG')}${eye(116, 77, E, 'axEyeG')}
             <path d="M79 77 A5 5 0 0 1 89 77 Z M111 77 A5 5 0 0 1 121 77 Z" fill="#7fb878" opacity=".9"/>
             <path d="M89 95 h22" stroke="#16261b" stroke-width="1.8" stroke-linecap="round"/>
             <path d="M93 92.5 v5 M100 92.5 v5 M107 92.5 v5" stroke="#16261b" stroke-width="1.1"/>`,
    sad:    `${eye(84, 78, E * 0.9, 'axEyeG')}${eye(116, 78, E * 0.9, 'axEyeG')}
             <path d="M90 99 q10 -6 20 0" stroke="#16261b" stroke-width="1.8" fill="none" stroke-linecap="round"/>${tearDrop(121, 86)}`,
    tired:  `<path d="M79 78 h10 M111 78 h10" stroke="#16261b" stroke-width="2.4" stroke-linecap="round"/>
             <ellipse cx="100" cy="96" rx="3" ry="2.2" fill="#16261b"/>${zzz(140, 46)}`,
  };
  let acc = '';
  if (k >= 2) acc += neonHeadband(60, 62, 100, 54, 140, 62);
  if (k >= 4) acc += neonCrown(100, 34);
  const wrist = k >= 3 ? [-1, 1].map(d => neonWrist(100 + d * (S + 20.5), 101, A * 1.7)).join('') : '';
  // レジェンドは稲妻をまとう
  const zap = k >= 5 ? [[34, 70, 1], [166, 84, -1]].map(([x, y, d]) =>
    `<path d="M${x} ${y} l${d * 8} 12 h${-d * 7} l${d * 9} 16" stroke="#ffe066" stroke-width="2.4" fill="none" stroke-linejoin="round" filter="url(#glow)"/>`).join('') : '';
  return humanoidFrame(P, {
    behind: zap,
    bodyFilter: 'rim',
    body: `${B.legs}${B.arms}${B.clip}<path d="${B.torso}" fill="${skin}"/><path d="${B.torso}" fill="url(#rimLight)"/>`,
    overBody: `<g clip-path="url(#frTorso)">${B.pecs}${B.abs}${stitch(100 - S * 0.75, 126, 100 - S * 0.1, 120, 4)}</g>
      <g filter="url(#rim)">${shorts}</g>
      ${[-1, 1].map(d => stitch(100 + d * (S + 2), 110, 100 + d * (S - 6), 126, 3)).join('')}
      ${B.armShine}${wrist}`,
    head: `
      ${bolt(56, 98, -1)}${bolt(144, 98, 1)}
      <g filter="url(#rim)">
        <ellipse cx="59" cy="82" rx="6" ry="9" fill="${skin}"/><ellipse cx="141" cy="82" rx="6" ry="9" fill="${skin}"/>
        <rect x="60" y="42" width="80" height="68" rx="22" fill="${skin}"/>
        <path d="M57 64 L57 44 Q57 34 68 34 L132 34 Q143 34 143 44 L143 64 L134 57 L126 64 L117 56 L108 63 L99 56 L90 63 L81 56 L72 63 L64 57 Z" fill="url(#frHair)"/>
        <rect x="60" y="42" width="80" height="68" rx="22" fill="url(#rimLight)"/>
      </g>
      <path d="M74 69 h18 M108 69 h18" stroke="#16261b" stroke-width="3" stroke-linecap="round"/>
      ${stitch(110, 54, 126, 60, 4)}
      ${stitch(122, 92, 132, 100, 3)}
      <ellipse cx="86" cy="48" rx="14" ry="4" fill="#fff" opacity=".45" filter="url(#soft)"/>
      <ellipse cx="72" cy="94" rx="6" ry="3.4" fill="#ff8fb8" opacity=".35" filter="url(#soft)"/>
      <ellipse cx="128" cy="94" rx="6" ry="3.4" fill="#ff8fb8" opacity=".35" filter="url(#soft)"/>
      ${faces[mood.face]}${acc}`,
    after: sweatOf(P, mood),
  });
}

// ===== ウーパールーパー：つるっと濡れた肌のツヤと、ふさふさのエラ =====
function drawAxolotl(st, mood, P) {
  const { k, upper, arm, leg, core, stamina, scale, hs, S, Wt, Hp, A, L } = P;
  const skin = 'url(#axSkin)';
  const line = '#9a3e5e';

  // エラ（左右3本ずつ、ふちに細かいフリル）
  const gills = (bx, by, len) => [-1, 1].map(d => [-1, 0, 1].map(j => {
    const ang = (-38 + (j + 1) * 26) * Math.PI / 180;
    const x0 = 100 + d * bx, y0 = by + j * 9;
    const cx = x0 + d * Math.cos(ang) * len, cy = y0 + Math.sin(ang) * len;
    const rot = d > 0 ? ang * 180 / Math.PI : 180 - ang * 180 / Math.PI;
    // 先端が光る（モンスターっぽい発光器官）
    const tx = x0 + d * Math.cos(ang) * len * 2, ty = y0 + Math.sin(ang) * len * 2;
    return `<ellipse cx="${cx}" cy="${cy}" rx="${len + 2}" ry="${len * 0.42}" fill="none" stroke="#ff6aa8" stroke-width="2.6" stroke-dasharray=".1 3.1" stroke-linecap="round" transform="rotate(${rot} ${cx} ${cy})"/>
            <ellipse cx="${cx}" cy="${cy}" rx="${len}" ry="${len * 0.3}" fill="url(#axGill)" transform="rotate(${rot} ${cx} ${cy})"/>
            <circle cx="${tx}" cy="${ty}" r="${len * 0.24}" fill="${NEON}"/>`;
  }).join('')).join('');

  if (k === 0) return cuteEgg(st, EGG_STYLE.axolotl);


  const torso = `M${100 - S} 124 C${100 - S} 112 ${100 - S * 0.5} 104 100 104 C${100 + S * 0.5} 104 ${100 + S} 112 ${100 + S} 124
    C${100 + S} 138 ${100 + Wt} 144 ${100 + Wt} 152 C${100 + Wt} 160 ${100 + Hp} 161 ${100 + Hp} 168
    Q100 177 ${100 - Hp} 168 C${100 - Hp} 161 ${100 - Wt} 160 ${100 - Wt} 152 C${100 - Wt} 144 ${100 - S} 138 ${100 - S} 124 Z`;
  const tail = `M${100 + Hp - 6} 158 C${128 + Hp} 168 ${150 + Hp * 0.4} 150 ${160 + Hp * 0.3} 124
    C${154 + Hp * 0.3} 156 ${134} 180 ${100 + Hp - 8} 176 Z`;

  const pecs = [-1, 1].map(d =>
    `<ellipse cx="${100 + d * S * 0.42}" cy="136" rx="${S * 0.44}" ry="${7 + upper * 3}" fill="url(#muscleP)" opacity="${0.2 + upper * 0.8}"/>
     <path d="M${100 + d * S * 0.82} 138 Q${100 + d * S * 0.42} ${145 + upper * 2} 100 140" stroke="#e58aa6" stroke-width="1.2" fill="none" opacity="${upper * 0.8}"/>`).join('');
  let abs = '';
  if (core > 0.15) {
    for (let row = 0; row < 3; row++) for (const d of [-1, 1]) {
      abs += `<rect x="${100 + (d < 0 ? -10.5 : 1.5)}" y="${145 + row * 8.2}" width="9" height="7" rx="3.2" fill="url(#muscleP)" opacity="${Math.min(1, core * 1.2)}"/>`;
    }
  }
  const arms = [-1, 1].map(d => {
    const x = v => 100 + d * v;
    return `
      <ellipse cx="${x(S + 8)}" cy="125" rx="17" ry="${A}" fill="${skin}" transform="rotate(${d * 8} ${x(S + 8)} 125)"/>
      <ellipse cx="${x(S + 21)}" cy="111" rx="${A * 0.78}" ry="16" fill="${skin}" transform="rotate(${d * -5} ${x(S + 21)} 111)"/>
      <ellipse cx="${x(S + 9)}" cy="${119 - arm * 2}" rx="${9 + arm * 5}" ry="${A * 0.75 + arm * 3}" fill="${skin}"/>
      <ellipse cx="${x(S + 20)}" cy="93" rx="${A * 0.72 + 2}" ry="${A * 0.66 + 2}" fill="${skin}"/>
      ${[-1, 0, 1].map(j => `<circle cx="${x(S + 20) + j * 3.4}" cy="${86 - A * 0.4 + Math.abs(j)}" r="2.3" fill="${skin}"/>`).join('')}
      <circle cx="${x(S - 3)}" cy="118" r="${A + 3}" fill="${skin}"/>`;
  }).join('');
  // 肌のツヤ（濡れた感じ）
  const armShine = [-1, 1].map(d =>
    `<ellipse cx="${100 + d * (S + 6)}" cy="${114 - arm * 3}" rx="${4 + arm * 3}" ry="${1.5 + arm}" fill="#fff" opacity=".75" filter="url(#soft)"/>
     <ellipse cx="${100 + d * (S + 5)}" cy="${113 - arm * 3}" rx="${1.8 + arm}" ry=".9" fill="#fff"/>
     <path d="M${100 + d * (S + 14 + arm * 3)} ${124 - arm * 2} q${d * 4} -6 ${d * 2} -12" stroke="#b5476d" stroke-width="2" fill="none" opacity=".45" filter="url(#soft)"/>`).join('');
  const legs = [-1, 1].map(d => `
    <ellipse cx="${100 + d * 15}" cy="168" rx="${L}" ry="17" fill="${skin}"/>
    <ellipse cx="${100 + d * 16}" cy="182" rx="${L + 3}" ry="6.5" fill="${skin}"/>
    ${[-1, 0, 1].map(j => `<circle cx="${100 + d * 16 + j * 4.5}" cy="186" r="2.4" fill="${skin}"/>`).join('')}`).join('');
  // 光る斑点
  const dots = [[88, 58], [112, 58], [100, 52], [70, 70], [130, 70]].map(([x, y]) =>
    `<circle cx="${x}" cy="${y}" r="1.8" fill="${NEON}"/>`).join('');
  // 小さなツノ
  const horns = [-1, 1].map(d =>
    `<path d="M${100 + d * 14} 50 Q${100 + d * 18} 34 ${100 + d * 28} 30 Q${100 + d * 22} 40 ${100 + d * 24} 50 Z" fill="url(#axHorn)"/>`).join('');
  // 背びれのトゲ（しっぽ）
  const x0 = 100 + Hp - 6, xt = 160 + Hp * 0.3;
  const spikes = [0.3, 0.5, 0.7, 0.88].map(t => {
    const x = x0 + (xt - x0) * t, y = 158 + (124 - 158) * t - 8 * Math.sin(Math.PI * t);
    return `<path d="M${x - 5} ${y + 3} L${x + 1} ${y - 9} L${x + 5} ${y + 3} Z" fill="url(#axHorn)"/>`;
  }).join('');
  const tailDots = [0.4, 0.62, 0.82].map(t =>
    `<circle cx="${x0 + (xt - x0) * t}" cy="${158 + (124 - 158) * t + 8}" r="1.8" fill="${NEON}"/>`).join('');
  // 爪
  const claws = [-1, 1].map(d => [-1, 0, 1].map(j => {
    const cx = 100 + d * (S + 20) + j * 3.4, cy = 86 - A * 0.4 + Math.abs(j) - 2;
    return `<path d="M${cx - 1.3} ${cy} L${cx} ${cy - 4} L${cx + 1.3} ${cy} Z" fill="#fff6fb"/>`;
  }).join('')).join('');

  // 大きなうるうるの目＋小さなキバ
  const E = 7;
  const fang = (x, y) => `<path d="M${x - 2} ${y} L${x} ${y + 5} L${x + 2} ${y} Z" fill="#fff"/>`;
  const faces = {
    happy:  `<path d="M71 79 q7 -8 14 0 M115 79 q7 -8 14 0" stroke="#3a1a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
             <path d="M86 90 Q100 104 114 90 Z" fill="#7a2a45"/><ellipse cx="100" cy="96" rx="5" ry="2.5" fill="#ff8fb3"/>
             ${fang(91, 90)}${fang(109, 90)}`,
    normal: `${eye(78, 77, E, 'axEyeG')}${eye(122, 77, E, 'axEyeG')}
             <path d="M84 91 Q100 100 116 91" stroke="${line}" stroke-width="2" fill="none" stroke-linecap="round"/>${fang(108, 94.5)}`,
    sad:    `${eye(78, 79, E * 0.92, 'axEyeG')}${eye(122, 79, E * 0.92, 'axEyeG')}
             <path d="M88 97 Q100 90 112 97" stroke="${line}" stroke-width="2" fill="none" stroke-linecap="round"/>${tearDrop(128, 86)}`,
    tired:  `${eye(78, 78, E * 0.85, 'axEyeG')}${eye(122, 78, E * 0.85, 'axEyeG')}
             <path d="M72 78 A6 6 0 0 1 84 78 Z M116 78 A6 6 0 0 1 128 78 Z" fill="#f2a0ba"/>
             <path d="M72 78 h12 M116 78 h12" stroke="${line}" stroke-width="1.4"/>
             <ellipse cx="100" cy="95" rx="3" ry="2.2" fill="#7a2a45"/>${zzz(140, 52)}`,
  };

  let acc = '';
  if (k >= 2) acc += neonHeadband(60, 62, 100, 44, 140, 62);
  if (k >= 4) acc += neonCrown(100, 42);
  const wrist = k >= 3 ? [-1, 1].map(d => neonWrist(100 + d * (S + 20.5), 101, A * 1.7)).join('') : '';
  const sweat = stamina > 0.2 && mood.face === 'happy' ? `<path d="M146 78 q4 8 0 12 q-4 -4 0 -12" fill="${NEON}" filter="url(#glow)"/>` : '';
  // レジェンドはネオンの泡をまとう
  const bubbles = k >= 5 ? [[34, 120, 7], [44, 92, 4], [166, 104, 6], [158, 78, 3.5], [30, 66, 3]].map(([x, y, r]) =>
    `<circle cx="${x}" cy="${y}" r="${r}" fill="rgba(0,240,255,.08)" stroke="${NEON}" stroke-width="1.4" filter="url(#glow)"/>
     <circle cx="${x - r * 0.35}" cy="${y - r * 0.35}" r="${r * 0.25}" fill="#fff" opacity=".8"/>`).join('') : '';

  const headT = `translate(100 82) scale(${hs}) translate(-100 -76)`;
  return `
    ${auraOf(P)}
    <ellipse cx="100" cy="190" rx="${60 + leg * 10}" ry="9" fill="url(#floor)"/>
    <g transform="translate(100 188) scale(${scale}) translate(-100 -188)">
      <ellipse cx="100" cy="186" rx="${34 + S * 0.4}" ry="5" fill="#000" opacity=".55" filter="url(#soft)"/>
      ${bubbles}
      <g filter="url(#rim)">
        ${spikes}
        <path d="${tail}" fill="${skin}"/>
        <path d="${tail}" fill="none" stroke="rgba(255,215,228,.7)" stroke-width="3"/>
        ${legs}
        ${arms}
        <defs><clipPath id="axTorso"><path d="${torso}"/></clipPath></defs>
        <path d="${torso}" fill="${skin}"/>
        <g clip-path="url(#axTorso)"><ellipse cx="100" cy="150" rx="${S * 0.72}" ry="27" fill="url(#axBelly)"/></g>
        <path d="${torso}" fill="url(#rimLight)"/>
      </g>
      <g clip-path="url(#axTorso)">${pecs}${abs}</g>
      ${tailDots}${claws}
      ${armShine}
      ${wrist}
      <g transform="${headT}">
        <g filter="url(#rim)">
          ${horns}
          ${gills(36, 72, 13)}
          <ellipse cx="100" cy="76" rx="44" ry="31" fill="${skin}"/>
          <ellipse cx="100" cy="80" rx="44" ry="27" fill="url(#rimLight)"/>
        </g>
        ${dots}
        <ellipse cx="86" cy="57" rx="15" ry="5" fill="#fff" opacity=".8" filter="url(#soft)"/>
        <ellipse cx="81" cy="56" rx="4.5" ry="1.6" fill="#fff" opacity=".95"/>
        <ellipse cx="64" cy="89" rx="7" ry="3.8" fill="#ff5f95" opacity=".4" filter="url(#soft)"/>
        <ellipse cx="136" cy="89" rx="7" ry="3.8" fill="#ff5f95" opacity=".4" filter="url(#soft)"/>
        ${faces[mood.face]}
        ${acc}
      </g>
      ${sweat}
    </g>`;
}

// ===== 画面描画 =====
let lastLv = null, lastStage = null;
function render() {
  const st = computeState();
  const mood = moodOf(st);
  const c = CHARS[charOf()];
  const stage = { name: c.stages[st.stageIdx] };

  document.getElementById('todayLabel').textContent = today().replace(/-/g, '/');
  document.getElementById('petName').textContent = petName();
  document.getElementById('charPicker').innerHTML = Object.entries(CHARS).map(([id, ch]) =>
    `<button class="chip ${id === charOf() ? 'on' : ''}" style="--c:var(--cyan)" data-char="${id}">${ch.label}</button>`).join('');
  document.getElementById('petStage').textContent = `${stage.name}（Lv ${st.lv}）` +
    (STAGES[st.stageIdx + 1] ? ` ・ Lv ${STAGES[st.stageIdx + 1].lv}で進化` : ' ・ 最終形態！');
  document.getElementById('petTalk').textContent = talkOf(st, mood);
  document.getElementById('levelLabel').innerHTML = `<small>LV</small>${st.lv}`;
  document.getElementById('xpLabel').textContent = `${st.rest} / ${st.need} XP（累計 ${st.total}）`;
  document.getElementById('xpBar').style.width = `${(st.rest / st.need) * 100}%`;
  document.getElementById('moodLabel').textContent = mood.label + (st.idle > 1 ? `（${st.idle}日休み）` : '');
  document.getElementById('streakLabel').textContent = st.streak
    ? `${st.streak}日 / ボーナス +${Math.min(st.streak - 1, 5) * 10}%` : '-';

  const maxStat = Math.max(100, ...Object.values(st.stat));
  document.getElementById('stats').innerHTML = Object.entries(PARTS).map(([k, p]) => `
    <div class="stat" style="--c:${p.color}">
      <div class="row"><span>${p.stat}<small style="color:var(--sub);margin-left:4px">${p.name}</small></span><b>${st.stat[k]}</b></div>
      <div class="bar"><div style="width:${(st.stat[k] / maxStat) * 100}%"></div></div>
    </div>`).join('');

  document.getElementById('sumDays').textContent = st.days.length;
  document.getElementById('sumSets').textContent = st.sets;
  document.getElementById('sumVolume').textContent = Math.round(st.volume).toLocaleString();

  drawPet(st, mood);
  renderToday(st);
  renderDraft();
  renderHistory(st);
  renderData(st);

  // レベルアップ・進化の演出
  const leveled = lastLv !== null && st.lv > lastLv;
  if (leveled) {
    const evolved = st.stageIdx > lastStage;
    toast(evolved ? `EVOLVED — ${stage.name} になった` : `LEVEL UP — Lv ${st.lv}`);
    const box = document.getElementById('petCanvas');
    box.classList.remove('levelup'); void box.offsetWidth; box.classList.add('levelup');
  }
  lastLv = st.lv; lastStage = st.stageIdx;
  return leveled;
}

function entryHtml(r, draftIdx = null) {
  const p = PARTS[r.part];
  const detail = r.part === 'cardio' ? `${r.minutes}分`
    : `${r.reps}${r.sec ? '秒' : '回'} × ${r.sets}セット${Number(r.weight) ? `（+${r.weight}kg）` : ''}`;

    ? `<span class="xp">+${r._xp}XP</span><button class="mini" data-del="${r.id}">削除</button>`

  return `<div class="entry">
    <div><span class="tag" style="--c:${p.color}">${p.name}</span>${esc(r.exercise)}
      <div class="meta">${detail}</div></div>

function renderToday(st) {

  const list = st.recs.filter(r => r.date === d);
  document.getElementById('todayList').innerHTML = list.length
    ? list.map(r => entryHtml(r)).join('') : '<div class="empty">まだ記録がありません</div>';

function renderHistory(st) {
  const byDay = {};
  st.recs.forEach(r => (byDay[r.date] ||= []).push(r));
  const days = Object.keys(byDay).sort().reverse();
  document.getElementById('historyList').innerHTML = days.length ? days.map(d => {
    const xp = byDay[d].reduce((a, r) => a + r._xp, 0);
    return `<div class="day">${d.replace(/-/g, '/')}（+${xp}XP）</div>` + byDay[d].map(r => entryHtml(r)).join('');
  }).join('') : '<div class="empty">記録するとここに表示されます</div>';

  // 12週間カレンダー（日曜始まり）
  const xpByDay = Object.fromEntries(days.map(d => [d, byDay[d].reduce((a, r) => a + r._xp, 0)]));
  const now = new Date();
  const start = new Date(now); start.setDate(now.getDate() - now.getDay() - 7 * 11);
  let html = '';
  for (let i = 0; i < 84; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const x = xpByDay[ymd(d)] || 0;
    const cls = d > now ? 'style="opacity:.3"' : `class="${x ? (x > 150 ? 'l3' : x > 60 ? 'l2' : 'l1') : ''}"`;
    html += `<div ${cls} title="${ymd(d)} ${x}XP"></div>`;
  }
  document.getElementById('cal').innerHTML = html;
}

// ===== データ（グラフ・データベース） =====
const fmt = n => Math.round(n).toLocaleString();
// 目盛りのきりのいい最大値
function niceMax(v) {
  if (!(v > 0) || !isFinite(v)) return 10;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  return [1, 2, 2.5, 5, 10].map(m => m * p).find(m => m >= v);
}
// 棒グラフ
function barChart(labels, values, { color = NEON, unit = '' } = {}) {
  const W = 320, H = 150, L = 34, B = 18, T = 8;
  const max = niceMax(Math.max(...values, 0));
  const bw = (W - L) / values.length;
  const y = v => T + (H - T - B) * (1 - v / max);
  const every = Math.ceil(values.length / 6);
  let g = '';
  for (let i = 0; i <= 2; i++) {
    const v = max * i / 2;
    g += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#23232f"/><text x="${L - 5}" y="${y(v) + 3}" text-anchor="end">${fmt(v)}</text>`;
  }
  const bars = values.map((v, i) => v > 0
    ? `<rect x="${L + i * bw + bw * 0.18}" y="${y(v)}" width="${bw * 0.64}" height="${H - B - y(v)}" rx="${Math.min(3, bw * 0.2)}" fill="${color}" opacity=".9"><title>${labels[i]}: ${fmt(v)}${unit}</title></rect>` : '').join('');
  const xl = labels.map((l, i) => i % every === 0 || i === labels.length - 1
    ? `<text x="${L + i * bw + bw / 2}" y="${H - 4}" text-anchor="middle">${l}</text>` : '').join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><filter id="cg"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    ${g}<g filter="url(#cg)">${bars}</g>${xl}</svg>`;
}
// 折れ線グラフ（複数系列）
function lineChart(labels, series, { unit = '' } = {}) {
  const W = 320, H = 150, L = 34, B = 18, T = 8, R = 6;
  const all = series.flatMap(s => s.values).filter(v => v != null);
  const max = niceMax(Math.max(...all, 0));
  const n = labels.length;
  const x = i => n === 1 ? (L + W - R) / 2 : L + (W - L - R) * i / (n - 1);
  const y = v => T + (H - T - B) * (1 - v / max);
  const every = Math.ceil(n / 6);
  let g = '';
  for (let i = 0; i <= 2; i++) {
    const v = max * i / 2;
    g += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#23232f"/><text x="${L - 5}" y="${y(v) + 3}" text-anchor="end">${fmt(v)}</text>`;
  }
  const lines = series.map(s => {
    const pts = s.values.map((v, i) => v == null ? null : [x(i), y(v), v, labels[i]]).filter(Boolean);
    const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0]} ${p[1]}`).join(' ');
    const area = pts.length > 1 && s.fill ? `<path d="${d} L${pts[pts.length - 1][0]} ${H - B} L${pts[0][0]} ${H - B} Z" fill="${s.color}" opacity=".12"/>` : '';
    const dots = pts.length <= 40 ? pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="2.4" fill="${s.color}"><title>${p[3]}: ${fmt(p[2])}${unit}</title></circle>`).join('') : '';
    return `${area}<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" filter="url(#lg)"/>${dots}`;
  }).join('');
  const xl = labels.map((l, i) => i % every === 0 || i === n - 1
    ? `<text x="${x(i)}" y="${H - 4}" text-anchor="middle">${l}</text>` : '').join('');
  const legend = series.length > 1 ? `<div style="display:flex;gap:14px;font-size:11px;color:var(--sub);margin-top:6px">${series.map(s =>
    `<span><span style="display:inline-block;width:10px;height:3px;background:${s.color};box-shadow:0 0 6px ${s.color};vertical-align:middle;margin-right:5px"></span>${s.name}</span>`).join('')}</div>` : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><filter id="lg"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    ${g}${lines}${xl}</svg>${legend}`;
}
const md = d => `${Number(d.slice(5, 7))}/${Number(d.slice(8))}`;
const addDays = (d, n) => { const t = new Date(d + 'T00:00'); t.setDate(t.getDate() + n); return ymd(t); };
const weekStart = d => { const t = new Date(d + 'T00:00'); t.setDate(t.getDate() - t.getDay()); return ymd(t); };
// 合計回数（秒数の種目と有酸素は0）
const volOf = r => r.part === 'cardio' || r.sec ? 0 : r.reps * r.sets;
const totalOf = r => r.part === 'cardio' ? 0 : r.reps * r.sets;

let xpRange = '30';
const db = { sort: 'date', dir: -1, limit: 50 };

function renderData(st) {
  const recs = st.recs;
  const empty = '<div class="empty">記録するとグラフが表示されます</div>';
  const t = today();

  // XPの推移
  const byDayXp = {};
  recs.forEach(r => byDayXp[r.date] = (byDayXp[r.date] || 0) + r._xp);
  let xpHtml = empty;
  if (recs.length) {
    if (xpRange === '30') {
      const days = Array.from({ length: 30 }, (_, i) => addDays(t, i - 29));
      xpHtml = barChart(days.map(md), days.map(d => byDayXp[d] || 0), { unit: ' XP' });
    } else if (xpRange === '12w') {
      const w0 = weekStart(t);
      const weeks = Array.from({ length: 12 }, (_, i) => addDays(w0, (i - 11) * 7));
      const vals = weeks.map(w => recs.filter(r => weekStart(r.date) === w).reduce((a, r) => a + r._xp, 0));
      xpHtml = barChart(weeks.map(md), vals, { color: PINK, unit: ' XP' });
    } else {
      let sum = 0;
      const days = Object.keys(byDayXp).sort();
      xpHtml = lineChart(days.map(md), [{ name: '累計XP', color: LIME, fill: true, values: days.map(d => sum += byDayXp[d]) }], { unit: ' XP' });
    }
  }
  document.getElementById('xpChart').innerHTML = xpHtml;
  document.querySelectorAll('#xpRange .chip').forEach(b => b.classList.toggle('on', b.dataset.range === xpRange));

  // 部位別の割合
  const total = Object.values(st.stat).reduce((a, b) => a + b, 0);
  document.getElementById('partShare').innerHTML = total ? Object.entries(PARTS)
    .sort((a, b) => st.stat[b[0]] - st.stat[a[0]])
    .map(([k, p]) => `<div class="share-row" style="--c:${p.color}"><span class="name">${p.name}</span>
      <div class="bar"><div style="width:${st.stat[k] / total * 100}%"></div></div>
      <span class="pct">${(st.stat[k] / total * 100).toFixed(1)}%</span></div>`).join('') : empty;

  // 週ごとの総回数
  const w0 = weekStart(t);
  const weeks = Array.from({ length: 12 }, (_, i) => addDays(w0, (i - 11) * 7));
  const vols = weeks.map(w => recs.filter(r => weekStart(r.date) === w).reduce((a, r) => a + volOf(r), 0));
  document.getElementById('volumeChart').innerHTML = vols.some(v => v) ? barChart(weeks.map(md), vols, { color: '#39ff88', unit: ' 回' }) : empty;

  // 種目別の伸び
  const sel = document.getElementById('exSelect');
  const exList = [...new Set(recs.map(r => r.exercise))];
  const counts = Object.fromEntries(exList.map(e => [e, recs.filter(r => r.exercise === e).length]));
  exList.sort((a, b) => counts[b] - counts[a]);
  const cur = exList.includes(sel.value) ? sel.value : exList[0];
  sel.innerHTML = exList.map(e => `<option ${e === cur ? 'selected' : ''}>${esc(e)}</option>`).join('');
  sel.classList.toggle('hidden', !exList.length);
  let exHtml = empty;
  if (cur) {
    // 同じ名前が別の部位（例：有酸素と筋トレ）で使われていたら、最後に記録した部位にそろえる
    const lastPart = recs.filter(r => r.exercise === cur).at(-1).part;
    const rs = recs.filter(r => r.exercise === cur && r.part === lastPart);
    const days = [...new Set(rs.map(r => r.date))].sort();
    if (rs[0].part === 'cardio') {
      exHtml = lineChart(days.map(md), [{ name: '時間', color: NEON, fill: true,
        values: days.map(d => rs.filter(r => r.date === d).reduce((a, r) => a + r.minutes, 0)) }], { unit: ' 分' });
    } else if (rs.some(r => r.sec)) {
      exHtml = lineChart(days.map(md), [
        { name: '最長キープ（1セット）', color: NEON, values: days.map(d => Math.max(...rs.filter(r => r.date === d).map(r => r.reps))) },
        { name: '合計秒数', color: PINK, values: days.map(d => rs.filter(r => r.date === d).reduce((a, r) => a + r.reps * r.sets, 0)) },
      ], { unit: ' 秒' });
    } else if (rs.every(r => !Number(r.weight))) {
      exHtml = lineChart(days.map(md), [
        { name: '1セットの最高回数', color: NEON, values: days.map(d => Math.max(...rs.filter(r => r.date === d).map(r => r.reps))) },
        { name: '合計回数', color: PINK, values: days.map(d => rs.filter(r => r.date === d).reduce((a, r) => a + r.reps * r.sets, 0)) },
      ], { unit: ' 回' });
    } else {
      // 推定1RM（Epley式：重量 ×（1 + 回数 / 30））
      exHtml = lineChart(days.map(md), [
        { name: '最大重量', color: NEON, values: days.map(d => Math.max(...rs.filter(r => r.date === d).map(r => Number(r.weight) || 0))) },
        { name: '推定1RM', color: PINK, values: days.map(d => Math.max(...rs.filter(r => r.date === d).map(r => (Number(r.weight) || 0) * (1 + r.reps / 30)))) },
      ], { unit: ' kg' });
    }
  }
  document.getElementById('exChart').innerHTML = exHtml;

  renderDb(recs);
}

function dbRows(recs) {
  const part = document.getElementById('dbPart').value;
  const ex = document.getElementById('dbEx').value;
  const q = document.getElementById('dbSearch').value.trim().toLowerCase();
  const rows = recs.filter(r => (!part || r.part === part) && (!ex || r.exercise === ex) && (!q || r.exercise.toLowerCase().includes(q)));
  const key = {
    date: r => r.date + String(r.id).padStart(15, '0'), part: r => PARTS[r.part].name, exercise: r => r.exercise,
    weight: r => Number(r.weight) || 0, reps: r => r.reps || 0, sets: r => r.sets || 0,
    minutes: r => r.minutes || 0, volume: totalOf, xp: r => r._xp,
  }[db.sort];
  return rows.sort((a, b) => { const x = key(a), y = key(b); return (x > y ? 1 : x < y ? -1 : 0) * db.dir; });
}
function renderDb(recs) {
  // 絞り込みの選択肢
  const partSel = document.getElementById('dbPart'), exSel = document.getElementById('dbEx');
  const pv = partSel.value, ev = exSel.value;
  partSel.innerHTML = '<option value="">すべての部位</option>' + Object.entries(PARTS).map(([k, p]) => `<option value="${k}" ${k === pv ? 'selected' : ''}>${p.name}</option>`).join('');
  const exs = [...new Set(recs.filter(r => !pv || r.part === pv).map(r => r.exercise))].sort();
  exSel.innerHTML = '<option value="">すべての種目</option>' + exs.map(e => `<option ${e === ev ? 'selected' : ''}>${esc(e)}</option>`).join('');

  const rows = dbRows(recs);
  const cols = [['date', '日付'], ['part', '部位'], ['exercise', '種目'], ['reps', '回数', 1], ['sets', 'セット', 1], ['volume', '合計', 1], ['weight', '加重', 1], ['minutes', '分', 1], ['xp', 'XP', 1]];
  const head = '<tr>' + cols.map(([k, l, n]) => `<th data-sort="${k}" class="${n ? 'n' : ''} ${db.sort === k ? 'sorted' : ''}">${l}${db.sort === k ? (db.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('') + '</tr>';
  const dash = '<span style="color:var(--line)">-</span>';
  const body = rows.slice(0, db.limit).map(r => {
    const c = r.part === 'cardio', p = PARTS[r.part];
    return `<tr><td>${r.date.slice(2).replace(/-/g, '/')}</td><td><span class="tag" style="--c:${p.color}">${p.name}</span></td><td>${esc(r.exercise)}</td>
      <td class="n">${c ? dash : r.reps + (r.sec ? '秒' : '')}</td><td class="n">${c ? dash : r.sets}</td>
      <td class="n">${c ? dash : fmt(totalOf(r)) + (r.sec ? '秒' : '')}</td><td class="n">${c || !Number(r.weight) ? dash : r.weight}</td>
      <td class="n">${c ? r.minutes : dash}</td><td class="n" style="color:var(--lime)">${r._xp}</td></tr>`;
  }).join('');
  document.getElementById('dbTable').innerHTML = rows.length ? head + body : `<tr><td class="empty">該当する記録がありません</td></tr>`;
  document.getElementById('dbCount').textContent = `${rows.length}件${rows.length > db.limit ? `（${db.limit}件表示）` : ''}`;
  document.getElementById('dbMore').classList.toggle('hidden', rows.length <= db.limit);
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

// ===== 記録フォーム =====
let currentPart = 'chest';
function renderChips() {
  document.getElementById('partChips').innerHTML = Object.entries(PARTS).map(([k, p]) =>
    `<button class="chip ${k === currentPart ? 'on' : ''}" style="--c:${p.color}" data-part="${k}">${p.name}</button>`).join('');
  document.getElementById('fExercise').innerHTML =
    PARTS[currentPart].ex.map(e => `<option value="${e}">${e}（${LEVELS[EX_BY_NAME[e].level]}）</option>`).join('') + '<option value="__custom">その他（自由入力）</option>';
  const cardio = currentPart === 'cardio';
  document.getElementById('weightFields').classList.toggle('hidden', cardio);
  document.getElementById('cardioFields').classList.toggle('hidden', !cardio);
  document.getElementById('fCustom').classList.add('hidden');
  renderGuide();
  updatePreview();
}
// 選んだ種目のやり方
function renderGuide() {
  const ex = EX_BY_NAME[document.getElementById('fExercise').value];
  const sum = document.getElementById('guideSummary');
  const box = document.getElementById('guide');
  sum.parentElement.classList.toggle('empty-guide', !ex);
  if (!ex) { sum.textContent = '自由入力の種目です'; box.open = false; document.getElementById('guideBody').innerHTML = ''; }
  else {
    sum.innerHTML = `目安：${ex.goal}<span class="lvl lvl${ex.level}">${LEVELS[ex.level]}</span>`;
    document.getElementById('guideBody').innerHTML = `
      <h4>効く部位</h4><div>${ex.target}</div>
      <h4>やり方</h4><ol>${ex.steps.map(t => `<li>${t}</li>`).join('')}</ol>
      <h4>ポイント</h4><ul>${ex.points.map(t => `<li>${t}</li>`).join('')}</ul>`;
  }
  const sec = !!(ex && ex.sec);
  document.getElementById('repsLabel').textContent = sec ? '秒数' : '回数';
  document.getElementById('fReps').placeholder = sec ? '30' : '10';
}
function readForm() {
  const sel = document.getElementById('fExercise').value;
  const exercise = sel === '__custom' ? document.getElementById('fCustom').value.trim() : sel;
  const r = { date: document.getElementById('fDate').value || today(), part: currentPart, exercise };
  if (currentPart === 'cardio') {
    r.minutes = parseInt(document.getElementById('fMinutes').value, 10) || 0;
  } else {
    r.weight = parseFloat(document.getElementById('fWeight').value) || 0;
    r.reps = parseInt(document.getElementById('fReps').value, 10) || 0;
    r.sets = parseInt(document.getElementById('fSets').value, 10) || 0;
    if (EX_BY_NAME[exercise]?.sec) r.sec = true;
  }
  return r;
}
function validRecord(r) {
  if (!r.exercise) return '種目名を入力してください';
  if (r.part === 'cardio') return r.minutes > 0 ? null : '時間を入力してください';
  if (r.reps <= 0) return r.sec ? '秒数を入力してください' : '回数を入力してください';
  if (r.sets <= 0) return 'セット数を入力してください';
  if (r.weight < 0) return '重量が正しくありません';
  return null;
}
function updatePreview() {
  const r = readForm();
  document.getElementById('xpPreview').textContent = validRecord(r) ? '0 XP' : `${baseXp(r)} XP〜`;
}

document.getElementById('partChips').addEventListener('click', e => {
  const k = e.target.dataset.part; if (!k) return;
  currentPart = k; renderChips();
});
document.getElementById('fExercise').addEventListener('change', e => {
  document.getElementById('fCustom').classList.toggle('hidden', e.target.value !== '__custom');
  renderGuide();
  updatePreview();
});
['fWeight', 'fReps', 'fSets', 'fMinutes', 'fCustom'].forEach(id =>
  document.getElementById(id).addEventListener('input', updatePreview));
document.getElementById('fDate').addEventListener('change', render);

// 記録をまとめて保存して、獲得XPを表示する
function commit(items) {
  const date = document.getElementById('fDate').value || today();
  if (date > today()) { toast('未来の日付には記録できません'); return false; }
  const before = computeState().total;
  const base = Date.now();
  items.forEach((r, i) => data.records.push({ ...r, date, id: base + i }));
  save();
  const gained = computeState().total - before;
  if (!render()) toast(items.length > 1 ? `${items.length}件記録  +${gained} XP` : `+${gained} XP`);
  return true;
}
function formItem() {
  const r = readForm();
  const err = validRecord(r);
  if (err) { toast(err); return null; }
  delete r.date;
  return r;
}
document.getElementById('saveBtn').addEventListener('click', () => {
  const r = formItem();
  if (r && commit([r])) document.getElementById('fReps').value = '';
});
document.getElementById('addBtn').addEventListener('click', () => {
  const r = formItem();
  if (!r) return;
  data.draft.push(r);
  save(); renderDraft();
  toast(`リストに追加（${data.draft.length}件）`);
});
document.getElementById('draftSaveBtn').addEventListener('click', () => {
  if (!data.draft.length) return;
  const items = data.draft;
  data.draft = [];
  if (!commit(items)) { data.draft = items; save(); }
});
document.getElementById('draftClearBtn').addEventListener('click', async () => {
  if (!await dialog('リストを空にしますか？')) return;
  data.draft = []; save(); renderDraft();
});
document.getElementById('draftList').addEventListener('click', e => {
  const i = e.target.dataset.draftDel;
  if (i === undefined) return;
  data.draft.splice(Number(i), 1);
  save(); renderDraft();
});
// 直近のトレーニング日のメニューをリストに読み込む
document.getElementById('loadLastBtn').addEventListener('click', () => {
  const date = document.getElementById('fDate').value || today();
  const days = [...new Set(data.records.map(r => r.date))].filter(d => d < date).sort();
  const last = days[days.length - 1];
  if (!last) { toast('前回の記録がありません'); return; }
  const items = data.records.filter(r => r.date === last).sort((a, b) => a.id - b.id)
    .map(({ part, exercise, weight, reps, sets, minutes, sec }) =>
      part === 'cardio' ? { part, exercise, minutes } : { part, exercise, weight, reps, sets, ...(sec ? { sec } : {}) });
  data.draft.push(...items);
  save(); renderDraft();
  toast(`${last.slice(5).replace('-', '/')} のメニューを${items.length}件追加`);
});

document.body.addEventListener('click', async e => {
  const id = e.target.dataset.del;
  if (!id) return;
  if (!await dialog('この記録を削除しますか？', { danger: true })) return;
  data.records = data.records.filter(r => String(r.id) !== id);
  save(); lastLv = null; render();
});

document.getElementById('charPicker').addEventListener('click', e => {
  const id = e.target.dataset.char;
  if (!id || id === data.char) return;
  data.char = id; save(); render();
});

document.getElementById('renameBtn').addEventListener('click', async () => {
  const n = await dialog(`${CHARS[charOf()].label}の名前`, { input: petName() });
  if (n && n.trim()) { data.names[charOf()] = n.trim().slice(0, 20); save(); render(); }
});

// ===== データ管理 =====
document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `muscle-pet-${today()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
document.getElementById('copyBtn').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(JSON.stringify(data));
    toast('コピーしました');
  } catch { toast('コピーできませんでした'); }
});
document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.records)) throw new Error();
    if (!await dialog(`${d.records.length}件の記録で上書きします。よろしいですか？`)) { e.target.value = ''; return; }
    data = { char: d.char || data.char, names: d.names || data.names, records: d.records, draft: [] };
    save(); lastLv = null; render(); toast('復元しました');
  } catch { toast('ファイルを読み込めませんでした'); }
  e.target.value = '';
});
document.getElementById('resetBtn').addEventListener('click', async () => {
  if (!await dialog('すべての記録が消え、キャラの育ち具合もリセットされます。本当に削除しますか？', { danger: true })) return;
  data = { char: data.char, names: data.names, records: [], draft: [] };
  save(); lastLv = null; render(); toast('リセットしました');
});

// ===== データタブの操作 =====
document.getElementById('xpRange').addEventListener('click', e => {
  const r = e.target.dataset.range; if (!r) return;
  xpRange = r; renderData(computeState());
});
document.getElementById('exSelect').addEventListener('change', () => renderData(computeState()));
['dbPart', 'dbEx'].forEach(id => document.getElementById(id).addEventListener('change', () => { db.limit = 50; renderDb(computeState().recs); }));
document.getElementById('dbSearch').addEventListener('input', () => { db.limit = 50; renderDb(computeState().recs); });
document.getElementById('dbTable').addEventListener('click', e => {
  const k = e.target.closest('th')?.dataset.sort; if (!k) return;
  db.dir = db.sort === k ? -db.dir : (k === 'date' || k === 'xp' || k === 'volume' || k === 'weight' ? -1 : 1);
  db.sort = k; renderDb(computeState().recs);
});
document.getElementById('dbMore').addEventListener('click', () => { db.limit += 100; renderDb(computeState().recs); });
document.getElementById('csvBtn').addEventListener('click', async () => {
  const rows = dbRows(computeState().recs);
  const q = v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v;
  const csv = ['日付,部位,種目,回数・秒数,単位,セット,合計,加重(kg),時間(分),XP',
    ...rows.map(r => [r.date, PARTS[r.part].name, r.exercise, r.reps ?? '', r.part === 'cardio' ? '' : r.sec ? '秒' : '回', r.sets ?? '',
      totalOf(r) || '', Number(r.weight) || '', r.minutes ?? '', r._xp].map(q).join(','))].join('\n');
  try { await navigator.clipboard.writeText(csv); toast(`${rows.length}件をCSVでコピーしました`); }
  catch { toast('コピーできませんでした'); }
});

// ===== タブ =====
document.querySelector('nav').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  ['home', 'log', 'data', 'history'].forEach(t =>
    document.getElementById('tab-' + t).classList.toggle('hidden', t !== b.dataset.tab));
  window.scrollTo(0, 0);
});

// ===== 起動 =====
document.getElementById('fDate').value = today();
renderChips();
render();
</script>
</body>
</html>
