# 会社の設定。ツール（./solo）はここを読んで動く。
# 設立前のため仮の値。決まったら書き換える。

[company]
name = "株式会社デモ（サンプルデータ）"
type = "株式会社"            # "株式会社" または "合同会社"
representative = "代表取締役 〇〇 〇〇"
postal_code = ""
address = ""
email = ""
phone = ""
founded = "2026-04-01"        # 設立日（登記申請日）
fiscal_year_end_month = 3     # 決算月（設立月の前月にすると1期目が最も長くなる）
officer_term_years = 10        # 株式会社の役員任期（非公開会社は最長10年）。合同会社は無視される

[invoice]
registration_number = "T1234567890123"       # インボイス登録番号（T + 13桁）。未登録なら空
default_tax_rate = 10          # 消費税率（%）
due_rule = "next_month_end"    # 支払期限："next_month_end"（翌月末） / "days:30"（30日後）
bank = "〇〇銀行 〇〇支店 普通 0000000 カ）サンプル"
note = "振込手数料はご負担をお願いいたします。"

[tax]
consumption_taxable = false    # 消費税の課税事業者か（資本金1,000万円未満なら原則1〜2期目は免税）
withholding_special = true     # 源泉所得税の納期の特例を受けるか（年2回納付になる）

[cash]
balance = 3000000                    # 手元資金（口座残高）
as_of = "2026-04-01"           # 上の残高の基準日
warn_months = 6                # 固定費の何か月分を下回ったら警告するか

[goal]
monthly_sales = 800000              # 月の売上目標
monthly_profit = 300000             # 月の利益目標
