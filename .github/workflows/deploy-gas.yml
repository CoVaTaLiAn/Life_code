# main の gas/gmail-sorter が更新されたら、Google Apps Script に自動で反映する
name: Deploy GAS

on:
  push:
    branches: [main]
    paths:
      - "gas/gmail-sorter/**"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gas/gmail-sorter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install clasp
        run: npm install -g @google/clasp@3.1.3

      - name: Write clasp credentials and project
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_SCRIPT_ID: ${{ vars.GAS_SCRIPT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$GAS_SCRIPT_ID" ]; then
            echo "CLASPRC_JSON (secret) と GAS_SCRIPT_ID (variable) を設定してください" >&2
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"."}' "$GAS_SCRIPT_ID" > .clasp.json

      - name: Push to Apps Script
        run: clasp push --force
