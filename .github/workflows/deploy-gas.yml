# main の gas/gmail-sorter が更新されたら、Google Apps Script に自動で反映する
# main：メインの Gmail（Variable: GAS_SCRIPT_ID）／sub：サブの Gmail（Variable: GAS_SCRIPT_ID_SUB。未設定ならスキップ）
name: Deploy GAS

on:
  push:
    branches: [main]
    paths:
      - "gas/gmail-sorter/**"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: main
            id_var: GAS_SCRIPT_ID
          - target: sub
            id_var: GAS_SCRIPT_ID_SUB
    defaults:
      run:
        working-directory: gas/gmail-sorter
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install clasp
        run: npm install -g @google/clasp@3.1.3

      - name: Write clasp credentials and project
        id: creds
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_SCRIPT_ID: ${{ vars[matrix.id_var] }}
          ID_NAME: ${{ matrix.id_var }}
        run: |
          missing=""
          [ -z "$CLASPRC_JSON" ] && missing="$missing Secret:CLASPRC_JSON"
          [ -z "$GAS_SCRIPT_ID" ] && missing="$missing Variable:$ID_NAME"
          if [ -n "$missing" ]; then
            echo "::warning::GASへの反映をスキップしました。未設定:${missing}（Settings → Secrets and variables → Actions に登録。手順: gas/gmail-sorter/docs/setup-auto-deploy.md）"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"src"}' "$GAS_SCRIPT_ID" > .clasp.json
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Push to Apps Script
        if: steps.creds.outputs.ready == 'true'
        run: clasp push --force
