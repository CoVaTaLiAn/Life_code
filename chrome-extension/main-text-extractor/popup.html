<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本文だけ抜き出し</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1 id="title">本文を取り出しています…</h1>
    <p id="meta" class="meta"></p>
  </header>

  <div class="controls">
    <fieldset class="format">
      <legend class="sr-only">形式</legend>
      <label><input type="radio" name="format" value="text" checked> テキスト</label>
      <label><input type="radio" name="format" value="markdown"> Markdown</label>
    </fieldset>
    <label class="opt"><input type="checkbox" id="withSource" checked> タイトルとURLを付ける</label>
  </div>

  <textarea id="output" readonly spellcheck="false" aria-label="抜き出した本文"></textarea>

  <div class="actions">
    <button id="copy" type="button" disabled>コピー</button>
    <button id="save" type="button" disabled>ファイルに保存</button>
  </div>
  <p id="status" class="status" role="status" aria-live="polite"></p>

  <script src="popup.js"></script>
</body>
</html>
