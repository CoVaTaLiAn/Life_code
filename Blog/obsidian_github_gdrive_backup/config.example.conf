# ~/.config/obsidian-backup.conf にコピーして書き換える

# Obsidian Vault の場所（iCloud の例）
VAULT="$HOME/Library/Mobile Documents/iCloud~md~obsidian/Documents/MyVault"

# GitHub の private リポジトリ（SSH 推奨）
GITHUB_REMOTE="git@github.com:CoVaTaLiAn/LifeLog.git"
GIT_BRANCH="main"
# .git の置き場所（iCloud の外にする）
GIT_DIR_PATH="$HOME/.obsidian-vault.git"

# Google Drive for desktop のフォルダ（kohei.kobayashi818@gmail.com でログイン）
GDRIVE_DIR="$HOME/Library/CloudStorage/GoogleDrive-kohei.kobayashi818@gmail.com/マイドライブ/ObsidianBackup"
# 日次スナップショットの保持日数
SNAPSHOT_KEEP_DAYS=30

# 実行間隔（秒）。1800 = 30分
INTERVAL_SECONDS=1800

# 片方だけ使う場合は 0 に
ENABLE_GITHUB=1
ENABLE_GDRIVE=1
