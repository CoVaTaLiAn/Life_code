<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div id="title">読み込み中…</div>
    <div id="meta"></div>
  </header>

  <div class="tabs">
    <label><input type="radio" name="fmt" value="text" checked> テキスト</label>
    <label><input type="radio" name="fmt" value="markdown"> Markdown</label>
    <label class="opt"><input type="checkbox" id="withHeader"> タイトル・URLを付ける</label>
  </div>

  <textarea id="output" spellcheck="false" readonly></textarea>

  <div class="actions">
    <button id="copy" class="primary">コピー</button>
    <button id="save">ファイル保存</button>
  </div>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
